<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#23406f">
<title>VocaMate v9.1</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{max-width:540px;margin:auto;min-height:100vh;padding:20px 18px 96px}
header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 28px}
.logo{font-size:34px;font-weight:800;color:#23406f}.streak{background:#fff;border-radius:30px;padding:13px 20px;font-weight:750;box-shadow:0 5px 18px #0000000c}
h1{font-size:40px;line-height:1.08;margin:0 0 10px}.sub{font-size:20px;color:#71809a;margin-bottom:25px}
.card{background:#fff;border-radius:28px;padding:25px;margin-bottom:18px;box-shadow:0 8px 28px #203b6810}
.goal{background:#23406f;color:#fff}.goalrow{display:flex;justify-content:space-between;font-size:21px;font-weight:750}
.bar{height:11px;background:#ffffff36;border-radius:10px;margin:22px 0 12px;overflow:hidden}.fill{height:100%;background:#6d92ed;border-radius:10px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.btn{border:0;border-radius:20px;padding:17px 12px;font-size:18px;font-weight:750;cursor:pointer}.primary{background:#4772e6;color:#fff}.secondary{background:#fff;color:#23406f;border:1px solid #edf0f5}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e9f0;z-index:5}
.navin{max-width:540px;width:100%;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:9px 3px 11px;color:#75829a;font-size:12px;font-weight:700}
.nav button.active{color:#23406f}.navicon{font-size:19px;display:block;margin-bottom:2px}
.word{font-size:46px;font-weight:800;margin:12px 0 5px}.pill{display:inline-block;background:#edf2ff;color:#4772e6;padding:9px 15px;border-radius:16px;font-weight:750}
.meta{color:#71809a;font-size:18px}.meaning{font-size:24px;font-weight:750;margin:22px 0}
.example{background:#f5f7fb;border-radius:20px;padding:18px;font-size:18px;line-height:1.5}.tag{color:#4772e6;font-weight:800}
input,textarea,select{width:100%;border:1px solid #d9e0eb;border-radius:18px;padding:16px;font-size:18px;background:#fff;color:#172033}
textarea{min-height:95px;resize:vertical}label{display:block;font-weight:750;margin:16px 0 8px}
.searchrow{display:grid;grid-template-columns:1fr auto;gap:10px}.searchrow .btn{padding:15px 18px}
.info{background:#eef3ff;color:#4772e6;border-radius:18px;padding:14px;font-size:16px;margin-top:12px}
.success{background:#eaf8f1;color:#287957}.error{background:#fff0f0;color:#a44343}
.hidden{display:none!important}.resultgrid{display:grid;gap:10px;margin-top:18px}
.mini{background:#f7f8fb;border-radius:18px;padding:15px}.mini b{display:block;margin-bottom:5px}
.listitem{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:16px 0;border-bottom:1px solid #edf0f5}
.listitem:last-child{border-bottom:0}.delete{border:0;background:#fff0f0;color:#a44343;border-radius:12px;padding:9px 11px}
.empty{text-align:center;color:#71809a;padding:25px}.quizq{font-size:30px;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f5f7fb;border-radius:20px;padding:20px}.stat strong{font-size:30px;display:block}
.review-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}
.review-actions button{border:0;border-radius:17px;padding:15px 6px;font-weight:750;font-size:14px}
.again{background:#fff0f0;color:#a44343}.hard{background:#fff6df;color:#8a6411}.good{background:#eaf8f1;color:#287957}
.due{background:#fff7e6;color:#8a6411;border-radius:14px;padding:10px 13px;font-weight:700;display:inline-block}
.progressline{display:flex;justify-content:space-between;color:#71809a;font-size:15px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#172033;color:#fff;padding:12px 18px;border-radius:15px;z-index:10;font-weight:650}

.mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.mode{border:1px solid #dfe5ef;background:#f7f9fc;border-radius:18px;padding:14px;text-align:left;font-weight:750;color:#23406f}
.mode.active{background:#edf2ff;border-color:#4772e6}
.choice-grid{display:grid;gap:10px;margin-top:16px}
.choice{border:1px solid #dfe5ef;background:#fff;border-radius:17px;padding:15px;text-align:left;font-size:17px;font-weight:700;color:#172033}
.choice.correct{background:#eaf8f1;border-color:#77c7a3;color:#287957}
.choice.wrong{background:#fff0f0;border-color:#e2a0a0;color:#a44343}
.small{font-size:14px;color:#71809a}
.section-title{font-size:20px;font-weight:800;margin:0 0 10px}
.selectrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.badge{display:inline-block;background:#f0f3f8;color:#5e6c84;padding:7px 10px;border-radius:12px;font-size:13px;font-weight:750}
.speak{margin-left:7px;border:0;background:#edf2ff;color:#4772e6;border-radius:12px;padding:7px 10px;font-weight:800}
@media(max-width:380px){.word{font-size:40px}h1{font-size:34px}.btn{font-size:16px}}

.review-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.review-actions button{border:0;border-radius:18px;padding:15px 7px;font-size:14px;font-weight:800;cursor:pointer}
.review-actions .again{background:#fff0f0;color:#b33a3a}.review-actions .hard{background:#fff7e8;color:#9b6a12}.review-actions .good{background:#edf9f2;color:#287b52}
.review-progress{height:9px;background:#e9edf4;border-radius:9px;overflow:hidden;margin:14px 0 6px}.review-progress>div{height:100%;background:#4772e6;border-radius:9px}
.level-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.level{background:#f7f9fd;border-radius:18px;padding:15px}.level b{display:block;font-size:24px;margin-bottom:3px}.level span{color:#71809a;font-size:14px}
.next-review{background:#f7f9ff;border-radius:18px;padding:15px;margin-top:14px;color:#51627f}

.quiz-tools{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.smallbtn{border:1px solid #dce3ef;background:#fff;border-radius:14px;padding:10px 13px;font-weight:700;color:#23406f}
.smallbtn.active{background:#eaf0ff;border-color:#8da8e8}
.sprint-result{text-align:center;padding:35px 24px}
.bigscore{font-size:64px;font-weight:850;color:#23406f}

.reading-text{font-size:19px;line-height:1.8;background:#f7f9fc;border-radius:18px;padding:18px}
.reading-word{border:0;background:transparent;padding:2px 3px;border-radius:7px;color:#172033;font:inherit;cursor:pointer}
.reading-word.candidate{background:#eef3ff;color:#23406f;font-weight:650}
.reading-word.selected{background:#d9f4e8;color:#176b4a;font-weight:800}
.candidate-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.candidate-chip{border:0;border-radius:18px;padding:9px 13px;background:#eef3ff;color:#23406f;font-weight:700}
.candidate-chip.chosen{background:#d9f4e8;color:#176b4a}
.reading-form{padding:16px 0;border-bottom:1px solid #e5eaf2}
.reading-form:last-child{border-bottom:0}
.reading-form label{display:block;margin-top:10px;font-weight:700;font-size:14px}
.reading-form input,.reading-form select{width:100%;padding:13px;border:1px solid #dbe2ee;border-radius:14px;margin-top:6px;font-size:16px;background:#fff}

.navin{grid-template-columns:repeat(5,1fr)}
.nav button{font-size:12px}
.navicon{font-size:22px}
</style>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
</head>

 yield:{type:'verb',phonetic:'/jiːld/',definition:'to produce or provide a result',meaning:'üretmek, sonuç vermek',example:'The new method yielded better results.',synonyms:'produce, generate',antonyms:'consume'},
  archaeology:{type:'noun',phonetic:'/ˌɑːrkiˈɑːlədʒi/',definition:'the study of human history through the recovery and analysis of material remains',meaning:'arkeoloji',example:'Archaeology helps researchers understand ancient societies.',synonyms:'archaeological study',antonyms:''},

function save(){localStorage.setItem(KEY,JSON.stringify(words))}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
function today(){return new Date().toISOString().slice(0,10)}
function dueWords(){return words.filter(w=>!w.nextReview||new Date(w.nextReview)<=new Date())}
function nav(page){currentPage=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));

function render(){
 const m=document.getElementById('main');
 if(currentPage==='home')home(m);
 if(currentPage==='add')add(m);
 if(currentPage==='quiz')quiz(m);
 if(currentPage==='reading')reading(m);
 if(currentPage==='stats')stats(m);
}

function home(m){
 const addedToday=words.filter(w=>w.added===today()).length, due=dueWords();

function sampleCard(){return `<div class="card"><span class="pill">Örnek TOEFL kelimesi</span><div class="word">mitigate</div><div class="meta">/ˈmɪtɪɡeɪt/ • verb</div><div class="meaning">hafifletmek, azaltmak</div><div class="example">Governments should take measures to <span class="tag">mitigate</span> the effects of climate change.</div></div>`}
function wordCard(w){return `<div class="card"><span class="pill">Son eklenen</span><div class="word">${esc(w.word)} <button class="speak" onclick="speakWord(${JSON.stringify(w.word)})">🔊</button></div><div class="meta">${esc(w.phonetic||'')} • ${esc(w.type||'')}</div><div style="margin-top:10px"><span class="badge">${esc(w.category||'TOEFL Academic')}</span> <span class="badge">${esc(w.difficulty||'Orta')}</span></div><div class="meaning">${esc(w.meaning||'Türkçe anlam eklenmedi')}</div><div class="example">${esc(w.example||w.definition||'')}</div>
<div class="progressline"><span>Tekrar aralığı</span><b>${intervalLabel(w.interval||0)}</b></div></div>`}

 m.innerHTML=`<h1>Akıllı kelime ekle</h1><div class="sub">Kelimeyi yaz, VocaMate bilgileri getirsin. TOEFL kelimelerini kategorize et.</div>
 <div class="card"><label>İngilizce kelime *</label><div class="searchrow"><input id="wordInput" placeholder="Örn. substantial" autocomplete="off"><button class="btn primary" onclick="prepareWord()">🤖 Hazırla</button></div>
 <div class="meta" style="margin-top:12px">İnternet sözlüğü çalışmazsa yerleşik TOEFL sözlüğü devreye girer. Bilinmeyen kelimeleri de manuel ekleyebilirsin.</div><div id="result"></div></div>
 <button class="btn secondary" style="width:100%" onclick="nav('stats')">📚 Kelimelerimi gör</button>`;
}
async function prepareWord(){
 const input=document.getElementById('wordInput'), result=document.getElementById('result'), word=input.value.trim().toLowerCase();
 if(!word){toast('Önce bir kelime yaz.');return}
 result.innerHTML='<div class="info">🔎 Kelime bilgileri aranıyor...</div>';
 let data=null;
 if(fallback[word])data=fallback[word];
 else{
  try{
   const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),5000);
   const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word),{signal:controller.signal});clearTimeout(timer);
   if(r.ok){const json=await r.json(),x=json[0],ms=x.meanings||[],first=ms[0]||{},d=(first.definitions||[])[0]||{};
    data={type:first.partOfSpeech||'',phonetic:x.phonetic||(x.phonetics||[]).find(p=>p.text)?.text||'',definition:d.definition||'',meaning:'',example:d.example||'',synonyms:(d.synonyms||[]).join(', '),antonyms:(d.antonyms||[]).join(', ')}}
  }catch(e){}
 }
 if(!data){
  result.innerHTML=`<div class="info error">Bu kelime için otomatik bilgi bulunamadı.</div>
  <div class="card" style="margin-top:12px"><div class="mini"><b>Manuel ekleme</b> Kelimeyi yine de kaydedebilirsin.</div>
  <div class="resultgrid"><div class="mini"><b>Kelime</b>${esc(word)}</div>
  <label>Türkçe anlam *</label><input id="meaning" placeholder="Türkçe anlamını yaz">
  <div class="selectrow"><div><label>Kategori</label><select id="category"><option>TOEFL Academic</option><option>Business</option><option>Daily English</option><option>Banking</option></select></div>
  <div><label>Zorluk</label><select id="difficulty"><option>Orta</option><option>Kolay</option><option>Zor</option></select></div></div>
  <label>📘 Örnek cümle</label><textarea id="example" placeholder="Sözlükten gelen örnek cümle"></textarea>
  <label>✍️ Kendi örnek cümlen</label><textarea id="userExample" placeholder="Kelimeyi kullanarak kendi cümleni yaz..."></textarea>
  <label>Notun</label><textarea id="note" placeholder="Kelimeyi hatırlatacak kısa not..."></textarea>
  <button class="btn primary" onclick='saveWord(${JSON.stringify({word,type:'',phonetic:'',definition:'',meaning:'',example:'',synonyms:'',antonyms:''})})'>💾 Kelimeyi kaydet</button></div></div>`;return}
 const sourceNote=fallback[word]?'📚 Yerleşik TOEFL sözlüğünden bulundu':'🌐 İnternet sözlüğünden bulundu';
 result.innerHTML=`<div class="info">${sourceNote}</div><div class="resultgrid"><div class="mini"><b>Kelime</b>${esc(word)}</div><div class="mini"><b>Tanım</b>${esc(data.definition)}</div>
 <div class="mini"><b>Telaffuz</b>${esc(data.phonetic||'—')} &nbsp; <b style="display:inline">Tür</b> ${esc(data.type||'—')}</div>
 <label>Türkçe anlam *</label><input id="meaning" value="${esc(data.meaning||'')}" placeholder="Örn. önemli, kayda değer">
 <div class="selectrow"><div><label>Kategori</label><select id="category"><option>TOEFL Academic</option><option>Business</option><option>Daily English</option><option>Banking</option></select></div>
 <div><label>Zorluk</label><select id="difficulty"><option>Orta</option><option>Kolay</option><option>Zor</option></select></div></div>
 <label>📘 Örnek cümle</label><textarea id="example">${esc(data.example||'')}</textarea><label>✍️ Kendi örnek cümlen</label><textarea id="userExample" placeholder="Kelimeyi kullanarak kendi cümleni yaz...">${esc(data.userExample||'')}</textarea><label>Notun</label><textarea id="note" placeholder="Kelimeyi hatırlatacak kısa not..."></textarea>
 ${data.synonyms?`<div class="mini"><b>Synonym</b>${esc(data.synonyms)}</div>`:''}${data.antonyms?`<div class="mini"><b>Antonym</b>${esc(data.antonyms)}</div>`:''}
 <button class="btn primary" onclick='saveWord(${JSON.stringify({word,...data})})'>💾 Kelimeyi kaydet</button></div>`;
}
function saveWord(data){
 const meaning=document.getElementById('meaning').value.trim(),example=document.getElementById('example').value.trim(),userExample=document.getElementById('userExample')?.value.trim()||'',note=document.getElementById('note').value.trim();
 const category=document.getElementById('category')?.value||'TOEFL Academic';
 const difficulty=document.getElementById('difficulty')?.value||'Orta';
 if(!meaning){toast('Türkçe anlamı yazmalısın.');return}
 const old=words.find(w=>w.word===data.word);
 words=words.filter(w=>w.word!==data.word);
 words.push({...data,meaning,example,userExample,note,category,difficulty,added:old?.added||today(),interval:old?.interval||0,repetitions:old?.repetitions||0,nextReview:old?.nextReview||new Date().toISOString(),reviewLevel:old?.reviewLevel||'Öğreniliyor',reviewCount:old?.reviewCount||0,lastReviewed:old?.lastReviewed||'',quizCorrect:old?.quizCorrect||0,quizWrong:old?.quizWrong||0});
 save();toast('✅ Kelime kaydedildi');setTimeout(()=>nav('home'),500);
}

function startLearning(){currentPage='review';showReview(0)}
function startReview(){currentPage='review';showReview(0)}
function showReview(i){
 const due=dueWords().sort((a,b)=>new Date(a.nextReview||0)-new Date(b.nextReview||0));
 if(!due.length){currentPage='home';render();toast('🎉 Bugünlük tekrarın tamam!');return}
 const pos=i%due.length, w=due[pos],m=document.getElementById('main');
 const dueNow=due.length;
 const intervalText=w.interval?`${w.interval} gün`:'İlk tekrar';
 m.innerHTML=`<h1>Akıllı tekrar</h1><div class="sub">${pos+1} / ${dueNow} kelime • ${esc(intervalText)}</div>
 <div class="review-progress"><div style="width:${((pos+1)/dueNow)*100}%"></div></div>
 <div class="card"><span class="pill">Hatırlıyor musun?</span><div class="word">${esc(w.word)} <button class="speak" onclick="speakWord(${JSON.stringify(w.word)})">🔊</button></div>
 <div class="meta">${esc(w.phonetic||'')} • ${esc(w.type||'')} • ${esc(w.category||'TOEFL Academic')}</div>
 <div id="answerBox" class="hidden"><div class="meaning">${esc(w.meaning)}</div><div class="example">${esc(w.example||w.definition||'')}</div>${w.synonyms?`<div class="mini" style="margin-top:12px"><b>Synonym</b> ${esc(w.synonyms)}</div>`:''}${w.note?`<div class="mini" style="margin-top:8px"><b>Notum</b> ${esc(w.note)}</div>`:''}</div>
 <button id="showBtn" class="btn primary" style="width:100%;margin-top:22px" onclick="revealAnswer()">Anlamı göster</button>
 <div id="actions" class="hidden"><div class="meta" style="margin-top:18px">Ne kadar hatırladın?</div>
 <div class="review-actions"><button class="again" onclick="rateWord('${encodeURIComponent(w.word)}','again')">😵 Unuttum<br><small>10 dk</small></button><button class="hard" onclick="rateWord('${encodeURIComponent(w.word)}','hard')">🤔 Zorlandım<br><small>1 gün</small></button><button class="good" onclick="rateWord('${encodeURIComponent(w.word)}','good')">😊 Hatırladım<br><small>sonraki</small></button></div></div></div>`;
}
function revealAnswer(){document.getElementById('answerBox').classList.remove('hidden');document.getElementById('showBtn').classList.add('hidden');document.getElementById('actions').classList.remove('hidden')}
function rateWord(encoded,quality){
 const word=decodeURIComponent(encoded),w=words.find(x=>x.word===word);if(!w)return;
 const now=Date.now();
 if(quality==='again'){
   w.repetitions=0;w.interval=0;w.reviewLevel='Unutuldu';
   w.nextReview=new Date(now+10*60*1000).toISOString();
 }
 if(quality==='hard'){
   w.repetitions=Math.max(0,w.repetitions||0);w.interval=1;w.reviewLevel='Zorlanıyorum';
   w.nextReview=new Date(now+24*60*60*1000).toISOString();
 }
 if(quality==='good'){
   w.repetitions=(w.repetitions||0)+1;
   const levels=[1,3,7,14,30];
   w.interval=levels[Math.min(w.repetitions-1,levels.length-1)];
   w.reviewLevel=w.interval>=14?'Güçlü':'Öğreniliyor';
   w.nextReview=new Date(now+w.interval*24*60*60*1000).toISOString();
 }
 w.lastReviewed=new Date(now).toISOString();
 w.reviewCount=(w.reviewCount||0)+1;
 save();showReview(0);
}
function intervalLabel(n){return n?`${n} gün`:'ilk tekrar'}

let quizMode='meaning', quizScore=0, quizAnswered=false, quizSession=false, quizQ=0, quizTotal=10, quizCorrectSession=0;

function speakWord(word){
 if('speechSynthesis' in window){
  speechSynthesis.cancel();
  const u=new SpeechSynthesisUtterance(word);
  u.lang='en-US'; u.rate=.85;
  speechSynthesis.speak(u);
 }
}

function quiz(m){
 if(!words.length){
  m.innerHTML=`<h1>Quiz</h1><div class="sub">Henüz kendi kelimelerin yok.</div><div class="card empty">Önce birkaç kelime ekleyelim. 🚀</div><button class="btn primary" style="width:100%" onclick="nav('add')">＋ İlk kelimeyi ekle</button>`;
  return;
 }
 const w=words[(quizIndex)%words.length];
 const allMeanings=words.map(x=>x.meaning).filter(Boolean);
 let choices=[w.meaning];
 while(choices.length<4 && allMeanings.length){
   const candidate=allMeanings[Math.floor(Math.random()*allMeanings.length)];
   if(!choices.includes(candidate)) choices.push(candidate);
   if(choices.length>=Math.min(4,allMeanings.length)) break;
 }
 choices=choices.sort(()=>Math.random()-.5);
 quizAnswered=false;

 const sessionLabel=quizSession?`TOEFL Sprint • ${quizQ+1}/${quizTotal}`:`Soru ${quizIndex+1} • Skor ${quizScore}`;
 m.innerHTML=`<h1>Quiz</h1><div class="sub">${sessionLabel} • Skor ${quizSession?quizCorrectSession:quizScore}</div>
 <div class="card">
 <div class="mode-grid">
  <button class="mode ${quizMode==='meaning'?'active':''}" onclick="setQuizMode('meaning')">🇹🇷 Anlam</button>
  <button class="mode ${quizMode==='reverse'?'active':''}" onclick="setQuizMode('reverse')">🇬🇧 İngilizce</button>
 </div>
 <div class="quiz-tools">
   <button class="smallbtn ${quizSession?'active':''}" onclick="startToeflSprint()">🎯 TOEFL Sprint</button>
   ${quizSession?`<button class="smallbtn" onclick="endSprint()">✕ Bitir</button>`:''}
 </div>
 <div class="pill" style="margin-top:18px">${esc(w.category||'TOEFL Academic')} · ${esc(w.difficulty||'Orta')}</div>
 <div class="quizq" style="margin-top:18px">${quizMode==='meaning'?esc(w.word):esc(w.meaning)}</div>
 ${quizMode==='meaning'?`<button class="speak" onclick="speakWord(${JSON.stringify(w.word)})">🔊 Dinle</button>`:''}
 <div class="choice-grid">
 ${choices.map(c=>`<button class="choice" onclick='answerChoice(${JSON.stringify(c)},${JSON.stringify(w.meaning)})'>${esc(quizMode==='meaning'?c:reverseChoice(c))}</button>`).join('')}
 </div>
 <div id="quizResult"></div>
 </div>`;
}
function reverseChoice(c){
 const hit=words.find(w=>w.meaning===c);
 return hit?hit.word:c;
}
function setQuizMode(mode){quizMode=mode;quiz(document.getElementById('main'))}
function startToeflSprint(){
 if(!words.length){toast('Önce kelime ekle.');return}
 quizSession=true;quizQ=0;quizCorrectSession=0;quizIndex=Math.floor(Math.random()*words.length);
 quizMode=['meaning','reverse'][Math.floor(Math.random()*2)];
 quiz(document.getElementById('main'));
}
function endSprint(){
 quizSession=false;quizQ=0;quizCorrectSession=0;quiz(document.getElementById('main'));
}
function answerChoice(selected,correct){
 if(quizAnswered)return;
 quizAnswered=true;
 const ok=selected===correct;
 const w=words[quizIndex%words.length];
 if(ok){quizScore++;w.quizCorrect=(w.quizCorrect||0)+1;if(quizSession)quizCorrectSession++}
 else{w.quizWrong=(w.quizWrong||0)+1}
 save();
 document.querySelectorAll('.choice').forEach(btn=>{
   const txt=btn.textContent.trim();
   const expected=quizMode==='meaning'?correct:reverseChoice(correct);
   if(txt===expected)btn.classList.add('correct');
   if(txt=== (quizMode==='meaning'?selected:reverseChoice(selected)) && !ok)btn.classList.add('wrong');
   btn.disabled=true;
 });
 const resultText=ok?'✅ Doğru!':'❌ Bu sefer olmadı.';
 const nextAction=quizSession && quizQ+1>=quizTotal
   ? `<button class="btn primary" style="width:100%;margin-top:10px" onclick="finishSprint()">🏁 Sprint sonucunu gör</button>`
   : `<button class="btn secondary" style="width:100%;margin-top:10px" onclick="quizIndex++;if(quizSession)quizQ++;quiz(document.getElementById('main'))">Sonraki soru →</button>`;
 document.getElementById('quizResult').innerHTML=`<div class="info ${ok?'success':'error'}">${resultText}<br><b>${esc(w.word)}</b> → ${esc(w.meaning)}</div>${nextAction}`;
}
function finishSprint(){
 const score=quizCorrectSession, total=quizTotal, pct=Math.round(score/total*100);
 quizSession=false;
 document.getElementById('main').innerHTML=`<h1>🎯 Sprint tamamlandı</h1><div class="sub">10 soruluk TOEFL kelime çalışması</div>
 <div class="card sprint-result"><div class="bigscore">${pct}%</div><h2>${score} / ${total} doğru</h2>
 <div class="meta">${pct>=80?'Çok iyi gidiyorsun!':'Bir tur daha tekrar ederek güçlendirebilirsin.'}</div>
 <div class="btnrow" style="margin-top:20px"><button class="btn primary" onclick="startToeflSprint()">Tekrar sprint</button><button class="btn secondary" onclick="nav('stats')">İlerlemeyi gör</button></div></div>`;
}

let readingText='', readingWords=[], selectedReading=new Set(), readingFile=null;

const commonWords=new Set(('the a an and or but if then than of to in on at for from by with without as is are was were be been being this that these those it its they them their there here into about after before during while which who whom what when where why how can could may might must should would will shall do does did done have has had having not no yes very more most some any each every both either neither other another such only also too so because through over under between among against per as we your our my his her their i you he she me him us'.split(/\s+/)));
const readingNoise=new Set(('reg section question questions answer passage first second third fourth fifth page paragraph number text www com http https century king god sun moon'.split(/\s+/)));
const academicBoost=new Set(Object.keys(fallback).concat(('archaeology recovery analysis material culture excavated restored antiquarian conducted detailed investigations systematic burial discipline recognized evidence research method theory finding findings significant substantial mitigate derive demonstrate interpret assess imply subsequent sufficient fundamental empirical'.split(/\s+/))));

function normalizeToken(s){return s.toLowerCase().replace(/[^a-z'-]/g,'').trim()}
function candidateScore(w){
  let score=0;
  if(academicBoost.has(w))score+=5;
  if(fallback[w])score+=4;
  if(w.length>=7)score+=2;
  if(w.length>=10)score+=1;
  return score;
}
function candidateReadingWords(){
  return [...new Set(readingWords.map(normalizeToken)
    .filter(w=>w.length>=5 && !commonWords.has(w) && !readingNoise.has(w) && !words.some(x=>x.word===w)))]
    .filter(w=>candidateScore(w)>=5)
    .sort((a,b)=>candidateScore(b)-candidateScore(a) || b.length-a.length || a.localeCompare(b));
}

function reading(m){
 m.innerHTML=`<h1>📖 Reading Lab</h1><div class="sub">Reading ekran görüntünü yükle, bilmediğin kelimeleri seç ve VocaMate listene ekle.</div>
 <div class="card">
 <span class="pill">📷 Ekran görüntüsü</span>
 <h2 style="margin:10px 0 6px">Reading metni yükle</h2>
 <div class="meta">İngilizce bir PDF/soru ekran görüntüsünü fotoğraf olarak yükleyebilirsin. Metin cihazında işlenir; sonra kelimelere dokunarak seçim yaparsın.</div>
 <input id="readingFile" type="file" accept="image/*" style="margin-top:18px;width:100%" onchange="runOCR(this.files[0])">
 <div id="ocrStatus" class="info" style="margin-top:14px">Henüz görsel yüklenmedi.</div>
 </div>
 <div id="readingResult"></div>
 ${readingText?`<button class="btn secondary" style="width:100%" onclick="resetReading()">Yeni görsel yükle</button>`:''}`;
 if(readingText) renderReadingResult();
}
async function runOCR(file){
 if(!file)return;
 readingFile=file; readingText=''; readingWords=[]; selectedReading=new Set();
 const status=document.getElementById('ocrStatus');
 status.innerHTML='🔎 Görsel okunuyor...';
 try{
   const result=await Tesseract.recognize(file,'eng',{logger:msg=>{
     if(msg.status==='recognizing text' && msg.progress) status.innerHTML=`🔎 Metin okunuyor... ${Math.round(msg.progress*100)}%`;
   }});
   readingText=result.data.text||'';
   readingWords=(readingText.match(/[A-Za-z][A-Za-z'-]*/g)||[]);
   status.innerHTML=`✅ Metin okundu. ${readingWords.length} kelime bulundu.`;
   renderReadingResult();
 }catch(e){
   status.innerHTML='❌ Görsel okunamadı. Daha net bir ekran görüntüsü deneyebilirsin.';
 }
}
function renderReadingResult(){
 const box=document.getElementById('readingResult'); if(!box)return;
 const candidates=candidateReadingWords();
 const spans=(readingText.match(/\s+|[A-Za-z][A-Za-z'-]*|[^A-Za-z\s]+/g)||[]).map(token=>{
   const n=normalizeToken(token);
   if(!n)return esc(token);
   const isSel=selectedReading.has(n);
   const isCandidate=candidates.includes(n);
   const cls=isSel?'reading-word selected':(isCandidate?'reading-word candidate':'reading-word');
   return `<button class="${cls}" onclick="toggleReadingWord('${encodeURIComponent(n)}')" title="Kelimeyi seç">${esc(token)}</button>`;
 }).join('');
 box.innerHTML=`<div class="card">
 <div class="section-title">📄 Okunan metin</div>
 <div class="meta" style="margin-bottom:14px">Yeşil kelimeler yüksek güvenli TOEFL adaylarıdır. Metindeki diğer kelimelere de dokunarak kendin seçim yapabilirsin. VocaMate sen onaylamadan hiçbir kelimeyi listeye eklemez.</div>
 <div class="reading-text">${spans}</div>
 </div>
 <div class="card"> 
<div class="section-title">🧠 🎯 TOEFL kelime adayları</div>
  <div class="meta">${candidates.length?`${candidates.length} yüksek güvenli TOEFL kelime adayı bulundu. Diğer kelimeleri metin üzerinde kendin seçebilirsin.`:'Yüksek güvenli TOEFL adayı bulunamadı. Metindeki kelimelere dokunarak kendin seçebilirsin.'}</div>
  <div class="candidate-row">${candidates.slice(0,40).map(w=>`<button class="candidate-chip ${selectedReading.has(w)?'chosen':''}" onclick="toggleReadingWord('${encodeURIComponent(w)}')">${esc(w)}${fallback[w]?' •':''}</button>`).join('')}</div>
  ${candidates.length?`<button class="btn secondary" style="width:100%;margin-top:12px" onclick="selectTopReadingCandidates()">⭐ İlk ${Math.min(10,candidates.length)} adayı seç</button>`:''}
  </div>
  <div class="card">
  <div class="section-title">➕ Seçilen kelimeler</div>
 <div class="meta">${selectedReading.size?`${selectedReading.size} kelime seçildi.`:'Metin üzerindeki kelimelere dokunarak seç.'}</div>
 <div id="selectedWordsBox">${selectedReading.size?[...selectedReading].map(w=>`<div class="progressline"><span>${esc(w)}</span><button class="delete" onclick="toggleReadingWord('${encodeURIComponent(w)}')">Çıkar</button></div>`).join(''):'<div class="empty">Henüz kelime seçmedin.</div>'}</div>
 ${selectedReading.size?`<button class="btn primary" style="width:100%;margin-top:16px" onclick="prepareReadingSelected()">Seçilenleri listeye hazırla →</button>`:''}
 </div>`;
}
function selectTopReadingCandidates(){const candidates=candidateReadingWords().slice(0,10);candidates.forEach(w=>selectedReading.add(w));renderReadingResult();}

function toggleReadingWord(encoded){
 const w=decodeURIComponent(encoded); if(!w)return;
 if(selectedReading.has(w))selectedReading.delete(w); else selectedReading.add(w);
 renderReadingResult();
}

function readingSentenceFor(word){
 const text=readingText||'';
 const parts=text.split(/(?<=[.!?])\s+/).filter(Boolean);
 const hit=parts.find(s=>new RegExp(`\\b${word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'i').test(s));
 if(hit)return hit.trim();
 const idx=readingWords.findIndex(x=>normalizeToken(x)===word);
 if(idx<0)return '';
 return readingWords.slice(Math.max(0,idx-6),Math.min(readingWords.length,idx+7)).join(' ');
}
async function translateContextToTurkish(word, sentence){
 if(!sentence)return '';
 try{
   const phrase=sentence.length>500?sentence.slice(0,500):sentence;
   const q=encodeURIComponent(phrase);
   const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=tr&dt=t&q=${q}`;
   const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),7000);
   const r=await fetch(url,{signal:controller.signal}); clearTimeout(timer);
   if(!r.ok)return '';
   const j=await r.json();
   const out=(j?.[0]||[]).map(x=>x?.[0]||'').join('').trim();
   return out;
 }catch(e){return ''}
}
async function contextualMeaning(word, sentence){
 const d=fallback[word]||{};
 const translated=await translateContextToTurkish(word,sentence);
 if(!translated)return d.meaning||'';
 // Keep the concise dictionary meaning when available; otherwise use a context-aware phrase translation
 // so the user does not have to type a Turkish meaning manually.
 if(d.meaning)return d.meaning;
 return translated;
}
async function prepareReadingSelected(){
 const selected=[...selectedReading];
 if(!selected.length){toast('Önce kelime seç.');return}
 const box=document.getElementById('readingResult');
 box.innerHTML=`<div class="card"><div class="section-title">🧠 Reading bağlamından kelime bilgileri hazırlanıyor...</div><div class="meta">VocaMate seçtiğin kelimenin geçtiği cümleyi bulup Türkçe anlamı otomatik dolduruyor. Ardından kendi örnek cümleni ekleyebilirsin.</div><div id="readingForms"><div class="info">🔎 ${selected.length} kelime hazırlanıyor...</div></div></div>`;
 const forms=[];
 for(let i=0;i<selected.length;i++){
   const w=selected[i], d=fallback[w]||{}, sentence=readingSentenceFor(w);
   const meaning=await contextualMeaning(w,sentence);
   forms.push({w,d,sentence,meaning});
   const formsBox=document.getElementById('readingForms');
   if(formsBox){
     formsBox.innerHTML=forms.map((x,j)=>`<div class="reading-form">
       <b>${esc(x.w)}</b>
       ${x.sentence?`<div class="mini"><b>📖 Reading'deki cümle</b>${esc(x.sentence)}</div>`:''}
       ${x.meaning?`<div class="mini success"><b>🇹🇷 Otomatik anlam</b>${esc(x.meaning)}</div>`:'<div class="mini error">Otomatik çeviri bulunamadı. Tekrar deneyebilir veya anlamı düzenleyebilirsin.</div>'}
       <label>Türkçe anlam</label><input id="rmeaning_${j}" value="${esc(x.meaning||'')}" placeholder="Reading bağlamındaki anlam">
       <label>📘 VocaMate örnek cümlesi</label><textarea id="rexample_${j}" placeholder="Varsa sözlük örnek cümlesi">${esc(x.d.example||'')}</textarea>
       <label>✍️ Kendi örnek cümlen</label><textarea id="ruserExample_${j}" placeholder="Bu kelimeyle kendi İngilizce cümleni yaz..."></textarea>
       <label>Zorluk</label><select id="rdiff_${j}"><option>Orta</option><option>Kolay</option><option>Zor</option></select>
     </div>`).join('');
   }
 }
 const finalBox=document.getElementById('readingResult');
 if(finalBox){
   finalBox.innerHTML=`<div class="card"><div class="section-title">🧠 Reading'den otomatik kelime bilgileri</div>
   <div class="meta">Anlamlar Reading cümlesinin bağlamından otomatik hazırlanır. İstersen düzenleyebilirsin. Ayrıca her kelime için kendi İngilizce örnek cümleni ekleyebilirsin.</div>
   <div id="readingForms">${forms.map((x,j)=>`<div class="reading-form">
     <b>${esc(x.w)}</b>
     ${x.sentence?`<div class="mini"><b>📖 Reading'deki cümle</b>${esc(x.sentence)}</div>`:''}
     ${x.meaning?`<div class="mini success"><b>🇹🇷 Otomatik anlam</b>${esc(x.meaning)}</div>`:'<div class="mini error">Otomatik anlam bulunamadı; alanı düzenleyebilirsin.</div>'}
     <label>Türkçe anlam</label><input id="rmeaning_${j}" value="${esc(x.meaning||'')}" placeholder="Reading bağlamındaki anlam">
     <label>📘 VocaMate örnek cümlesi</label><textarea id="rexample_${j}" placeholder="Varsa sözlük örnek cümlesi">${esc(x.d.example||'')}</textarea>
     <label>✍️ Kendi örnek cümlen</label><textarea id="ruserExample_${j}" placeholder="Bu kelimeyle kendi İngilizce cümleni yaz..."></textarea>
     <label>Zorluk</label><select id="rdiff_${j}"><option>Orta</option><option>Kolay</option><option>Zor</option></select>
   </div>`).join('')}</div>
   <button class="btn primary" style="width:100%;margin-top:18px" onclick="saveReadingSelected()">💾 Kelimeleri listeye ekle</button></div>`;
 }
}
function saveReadingSelected(){
 const selected=[...selectedReading];
 let added=0;
 selected.forEach((w,i)=>{
   const meaning=document.getElementById(`rmeaning_${i}`)?.value.trim();
   const example=document.getElementById(`rexample_${i}`)?.value.trim()||'';
   const userExample=document.getElementById(`ruserExample_${i}`)?.value.trim()||'';
   if(!meaning)return;
   const d=fallback[w]||{};
   const contextSentence=readingSentenceFor(w);
   const old=words.find(x=>x.word===w);
   words=words.filter(x=>x.word!==w);
   words.push({word:w,type:d.type||'word',phonetic:d.phonetic||'',definition:d.definition||'',meaning,example,userExample,note:'Reading bağlamından eklendi',readingContext:contextSentence,readingSource:'Reading Lab',synonyms:d.synonyms||'',antonyms:d.antonyms||'',category:'TOEFL Academic',difficulty:document.getElementById(`rdiff_${i}`)?.value||'Orta',added:old?.added||today(),interval:old?.interval||0,repetitions:old?.repetitions||0,nextReview:old?.nextReview||new Date().toISOString(),reviewLevel:old?.reviewLevel||'Öğreniliyor',reviewCount:old?.reviewCount||0,lastReviewed:old?.lastReviewed||'',quizCorrect:old?.quizCorrect||0,quizWrong:old?.quizWrong||0});
   added++;
 });
 save();
 selectedReading=new Set();
 toast(`✅ ${added} kelime listeye eklendi`);
 setTimeout(()=>nav('reading'),500);
}
function resetReading(){readingText='';readingWords=[];selectedReading=new Set();render()}

function stats(m){
 const due=dueWords();
 const totalCorrect=words.reduce((a,w)=>a+(w.quizCorrect||0),0);
 const totalWrong=words.reduce((a,w)=>a+(w.quizWrong||0),0);
 const accuracy=(totalCorrect+totalWrong)?Math.round(totalCorrect/(totalCorrect+totalWrong)*100):0;
 const cats={};
 let strong=0,learning=0,hard=0,forgot=0;
 words.forEach(w=>{
   cats[w.category||'TOEFL Academic']=(cats[w.category||'TOEFL Academic']||0)+1;
   if(w.reviewLevel==='Güçlü')strong++;
   else if(w.reviewLevel==='Zorlanıyorum')hard++;
   else if(w.reviewLevel==='Unutuldu')forgot++;
   else learning++;
 });
 m.innerHTML=`<h1>İlerleme</h1><div class="sub">Kelime hazineni takip et.</div>
 <div class="stats"><div class="stat"><strong>${words.length}</strong>Toplam kelime</div><div class="stat"><strong>${due.length}</strong>Tekrar bekleyen</div><div class="stat"><strong>${accuracy}%</strong>Quiz başarısı</div><div class="stat"><strong>${totalCorrect}</strong>Doğru cevap</div></div>
 <div class="card" style="margin-top:18px"><div class="section-title">🧠 Kelime hafıza durumu</div>
 <div class="level-grid"><div class="level"><b>${strong}</b><span>💪 Güçlü</span></div><div class="level"><b>${learning}</b><span>📖 Öğreniliyor</span></div><div class="level"><b>${hard}</b><span>🤔 Zorlanıyorum</span></div><div class="level"><b>${forgot}</b><span>🔁 Yeniden öğren</span></div></div>
 </div>
 <div class="card"><div class="section-title">📅 Tekrar planı</div>
 <div class="meta">${due.length?`Bugün ${due.length} kelimeyi tekrar etmen gerekiyor.`:'Bugün tekrar bekleyen kelime yok.'}</div>
 ${due.length?`<button class="btn primary" style="width:100%;margin-top:16px" onclick="startReview()">Tekrara başla →</button>`:''}
 </div>
 <div class="card"><div class="section-title">Kategoriler</div>
 ${Object.keys(cats).length?Object.entries(cats).map(([k,v])=>`<div class="progressline"><span>${esc(k)}</span><b>${v}</b></div>`).join(''):'<div class="empty">Henüz kelime eklemedin.</div>'}</div>
 <div class="card"><h2>Kelime listem</h2>${words.length?words.slice().reverse().map(w=>{
   const next=w.nextReview&&new Date(w.nextReview)>new Date()?`📅 ${new Date(w.nextReview).toLocaleDateString('tr-TR')}`:'🔔 Şimdi';
   const level=w.reviewLevel||'Öğreniliyor';
   return `<div class="listitem"><div><b>${esc(w.word)}</b><button class="speak" onclick="speakWord(${JSON.stringify(w.word)})">🔊</button><div class="meta">${esc(w.meaning||'')}</div>${w.example?`<div class="example" style="margin-top:10px"><b>📘</b> ${esc(w.example)}</div>`:''}${w.userExample?`<div class="example" style="margin-top:8px;background:#eef8f3"><b>✍️ Benim cümlem:</b> ${esc(w.userExample)}</div>`:''}<div><span class="badge">${esc(w.category||'TOEFL Academic')}</span> <span class="badge">${esc(w.difficulty||'Orta')}</span> <span class="badge">${esc(level)}</span></div><div class="progressline"><span>Tekrar</span><span>${next}</span></div></div><button class="delete" onclick="deleteWord('${encodeURIComponent(w.word)}')">Sil</button></div>`;
 }).join(''):'<div class="empty">Henüz kelime eklemedin.</div>'}</div>`;
}

function deleteWord(encoded){const word=decodeURIComponent(encoded);words=words.filter(w=>w.word!==word);save();toast('Kelime silindi');render()}
render();
</script>
