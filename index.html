// V20: kelime verilerini eski sürümlerden koru; boşsa daha önce kullandığımız temel kelimeleri geri getir.
function loadWordsSafely(){
  const keys=['vocamate_words_v32','vocamate_words_v31','vocamate_words_v3','vocamate_words_v2'];
  const merged=[]; const seen=new Set();
  for(const k of keys){
    try{
      const arr=JSON.parse(localStorage.getItem(k)||'[]');
      if(Array.isArray(arr)) arr.forEach(w=>{
        const word=String(w.word||'').trim().toLowerCase();
        if(word && !seen.has(word)){seen.add(word); merged.push(w)}
      });
    }catch(e){}
  }
  if(!merged.length){
    const starter=['significant','substantial','mitigate'];
    starter.forEach(word=>{
      const d=fallback[word];

    });
  }
  return merged;
}
let words=loadWordsSafely();
let currentPage='home', quizIndex=0;
let appHistory=['home'], appHistoryIndex=0, historyBusy=false;

const fallback={
 significant:{type:'adjective',phonetic:'/sɪɡˈnɪfɪkənt/',definition:'important or notable; having a clear or meaningful effect',meaning:'önemli, kayda değer, anlamlı',example:'The study found a significant difference between the two groups.',synonyms:'important, notable, considerable',antonyms:'insignificant, minor'},
 substantial:{type:'adjective',phonetic:'/səˈstænʃəl/',definition:'of considerable importance, size, or worth',meaning:'önemli, kayda değer; büyük miktarda',example:'The project requires a substantial amount of time.',synonyms:'considerable, significant',antonyms:'insignificant, minor'},
 mitigate:{type:'verb',phonetic:'/ˈmɪtɪɡeɪt/',definition:'to make something less severe, harmful, or painful',meaning:'hafifletmek, azaltmak',example:'Governments should take measures to mitigate the effects of climate change.',synonyms:'alleviate, reduce',antonyms:'aggravate, intensify'},
 allocate:{type:'verb',phonetic:'/ˈæləkeɪt/',definition:'to give or distribute something for a particular purpose',meaning:'tahsis etmek, ayırmak',example:'The university allocated more funds to research.',synonyms:'assign, distribute',antonyms:'withhold'},
 inevitable:{type:'adjective',phonetic:'/ɪnˈevɪtəbəl/',definition:'certain to happen and impossible to avoid',meaning:'kaçınılmaz',example:'Some changes are inevitable.',synonyms:'unavoidable, certain',antonyms:'avoidable, uncertain'},
 enhance:{type:'verb',phonetic:'/ɪnˈhæns/',definition:'to improve the quality, value, or effectiveness of something',meaning:'geliştirmek, artırmak',example:'The new system will enhance customer experience.',synonyms:'improve, strengthen',antonyms:'weaken, reduce'},
 abundant:{type:'adjective',phonetic:'/əˈbʌndənt/',definition:'existing or available in large quantities',meaning:'bol, çok miktarda',example:'The region has abundant natural resources.',synonyms:'plentiful, ample',antonyms:'scarce'},
 acquire:{type:'verb',phonetic:'/əˈkwaɪər/',definition:'to get or obtain something',meaning:'edinmek, elde etmek',example:'Students acquire new skills through practice.',synonyms:'obtain, gain',antonyms:'lose'},
 adapt:{type:'verb',phonetic:'/əˈdæpt/',definition:'to change in order to suit a new situation',meaning:'uyum sağlamak, adapte olmak',example:'Animals adapt to changes in their environment.',synonyms:'adjust, modify',antonyms:'resist'},
 adjacent:{type:'adjective',phonetic:'/əˈdʒeɪsənt/',definition:'next to or near something else',meaning:'bitişik, komşu',example:'The laboratory is adjacent to the main building.',synonyms:'neighboring, adjoining',antonyms:'distant'},
 advocate:{type:'verb',phonetic:'/ˈædvəkeɪt/',definition:'to publicly support an idea or policy',meaning:'savunmak, desteklemek',example:'Many scientists advocate stronger environmental policies.',synonyms:'support, promote',antonyms:'oppose'},
 assess:{type:'verb',phonetic:'/əˈses/',definition:'to evaluate or estimate the nature, quality, or value of something',meaning:'değerlendirmek',example:'Researchers assessed the impact of the program.',synonyms:'evaluate, examine',antonyms:'ignore'},
 coherent:{type:'adjective',phonetic:'/koʊˈhɪrənt/',definition:'logical, consistent, and easy to understand',meaning:'tutarlı, anlaşılır',example:'The essay presents a coherent argument.',synonyms:'logical, consistent',antonyms:'incoherent, confusing'},
 controversial:{type:'adjective',phonetic:'/ˌkɑːntrəˈvɜːrʃəl/',definition:'causing disagreement or strong public discussion',meaning:'tartışmalı',example:'The proposal remains controversial.',synonyms:'debatable, disputed',antonyms:'uncontroversial'},

 derive:{type:'verb',phonetic:'/dɪˈraɪv/',definition:'to get something from a particular source',meaning:'elde etmek, türetmek',example:'Many medicines are derived from plants.',synonyms:'obtain, originate',antonyms:'lose'},
 diminish:{type:'verb',phonetic:'/dɪˈmɪnɪʃ/',definition:'to become or make something smaller or less important',meaning:'azalmak, azaltmak',example:'The effect of the treatment diminished over time.',synonyms:'decrease, reduce',antonyms:'increase'},

function save(){localStorage.setItem(KEY,JSON.stringify(words))}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
function today(){return new Date().toISOString().slice(0,10)}
function dueWords(){return words.filter(w=>!w.nextReview||new Date(w.nextReview)<=new Date())}
function openDrawer(){document.getElementById('drawer').classList.add('open');document.getElementById('drawerOverlay').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open');document.getElementById('drawerOverlay').classList.remove('open')}
function updateBottomNav(){
 const back=document.getElementById('bottomBack'), fwd=document.getElementById('bottomForward');
 if(back)back.disabled=appHistoryIndex<=0;
 if(fwd)fwd.disabled=appHistoryIndex>=appHistory.length-1;
}
function syncDrawer(){document.querySelectorAll('.drawer-item[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===currentPage))}
function pushPage(page){
 if(historyBusy){currentPage=page;return}
 if(appHistory[appHistoryIndex]===page)return;
 appHistory=appHistory.slice(0,appHistoryIndex+1);
 appHistory.push(page); appHistoryIndex=appHistory.length-1; currentPage=page;
}
function nav(page){pushPage(page);closeDrawer();syncDrawer();render();updateBottomNav()}
function appBack(){
 if(appHistoryIndex<=0)return;
 appHistoryIndex--; currentPage=appHistory[appHistoryIndex]; closeDrawer(); syncDrawer(); render(); updateBottomNav();
}
function appForward(){
 if(appHistoryIndex>=appHistory.length-1)return;
 appHistoryIndex++; currentPage=appHistory[appHistoryIndex]; closeDrawer(); syncDrawer(); render(); updateBottomNav();
}


function render(){
 const m=document.getElementById('main');
 if(currentPage==='home')home(m);
 if(currentPage==='toefl')toefl(m);
 if(currentPage==='add')add(m);
 if(currentPage==='quiz')quiz(m);
 if(currentPage==='reading')reading(m);
 if(currentPage==='patterns')patterns(m);
 if(currentPage==='stats')stats(m);
  if(currentPage==='wordDetail')wordDetail(m);
  if(currentPage==='review')showReview(0);
  syncDrawer(); updateBottomNav();
}

function toeflPractice(type){
 closeDrawer();
 const m=document.getElementById('main');
 const d=toeflData[type];
 const bank={
  reading:[
   {task:'Complete the Words',q:'The university plans to make its campus more environmentally ______ by expanding public transportation.',opts:['traditional','sustainable','temporary','financial'],a:1,ex:'“Sustainable” means able to continue with limited harm to the environment.'},
   {task:'Read in Daily Life',context:'Campus Notice: The science library will close at 6 p.m. on Friday because of scheduled maintenance. Students who need to study later can use the main library until midnight.',q:'Why will the science library close early?',opts:['A new course will begin','The building needs maintenance','Students requested shorter hours','The main library is closed'],a:1,ex:'The notice directly says the early closure is due to scheduled maintenance.'},
   {task:'Read an Academic Passage',context:'Researchers studying urban trees have found that vegetation can reduce surface temperatures in densely built areas. Trees provide shade and release water vapor through a process called transpiration. As a result, streets with more tree cover may remain cooler during hot weather.',q:'What is the main idea of the passage?',opts:['Urban trees grow faster than rural trees.','Trees can help cool densely built areas.','Transpiration only occurs during hot weather.','Cities are replacing streets with parks.'],a:1,ex:'The passage focuses on how vegetation contributes to lower urban temperatures.'}
  ],
  listening:[
   {task:'Listen and Choose a Response',audio:'You have a meeting with your academic advisor at two o’clock.',q:'What should you do?',opts:['Meet the advisor at 2 p.m.','Submit the assignment at 2 p.m.','Go to the library at 3 p.m.','Call the professor tomorrow.'],a:0,ex:'The speaker says the meeting is at two o’clock.'},
   {task:'Conversation',audio:'Student: I missed the study-group meeting. Woman: That’s okay. We moved it to Thursday because the professor changed the deadline.',q:'Why was the meeting moved?',opts:['The room was unavailable','The professor changed the deadline','The students had an exam','The professor cancelled the course'],a:1,ex:'The woman explicitly connects the change to the professor’s new deadline.'},
   {task:'Academic Talk',audio:'In many ecosystems, biodiversity can make communities more resilient to environmental change because different species respond differently to stress.',q:'What is one benefit of biodiversity mentioned by the speaker?',opts:['It increases rainfall','It makes ecosystems more resilient','It eliminates environmental stress','It reduces the number of species'],a:1,ex:'The speaker says biodiversity can make communities more resilient.'}
  ]
 };
 if(type==='reading'||type==='listening'){
  let idx=0,score=0,answered=false;
  const renderQ=()=>{
   const q=bank[type][idx]; answered=false;
   m.innerHTML=`<div class="practice-head"><button class="back-btn" onclick="nav('toefl')">‹</button><div><div class="practice-title">${d.icon} ${d.name}</div><div class="practice-sub">TOEFL iBT • 2026 practice</div></div></div>
   <div class="practice-shell"><span class="practice-kicker">${esc(q.task)}</span>${q.context?`<div class="practice-context">${esc(q.context)}</div>`:''}${type==='listening'?`<div class="listen-card"><button class="listen-play" onclick="speakToeflAudio(${JSON.stringify(q.audio)})">▶</button><div class="meta" style="margin-top:8px">Dinlemek için dokun</div></div>`:''}<div class="practice-q">${esc(q.q)}</div><div class="practice-options">${q.opts.map((o,i)=>`<button class="practice-option" data-i="${i}" onclick="selectPracticeOption(this)">${esc(o)}</button>`).join('')}</div><div id="practiceFeedback"></div><div class="practice-footer"><div class="practice-progress"><span style="width:${Math.round((idx+1)/bank[type].length*100)}%"></span></div><div class="practice-counter">${idx+1}/${bank[type].length}</div></div><button type="button" id="practiceNext" class="btn primary" style="width:100%;margin-top:14px">Cevabı kontrol et</button></div>`;
   const controlBtn=document.getElementById('practiceNext');
   if(controlBtn){let busy=false;const fire=()=>{if(busy)return;busy=true;checkPracticeAnswer(type);setTimeout(()=>busy=false,400)};controlBtn.addEventListener('click',fire);controlBtn.addEventListener('touchend',e=>{e.preventDefault();fire()},{passive:false});}
  };
  window._toeflRun={type,idx,score,bank,renderQ}; renderQ(); return;
 }
 if(type==='speaking'){
  m.innerHTML=`<div class="practice-head"><button class="back-btn" onclick="nav('toefl')">‹</button><div><div class="practice-title">🎤 Speaking Practice</div><div class="practice-sub">Listen and Repeat + Interview</div></div></div>
  <div class="task-tabs"><button class="task-tab active">Listen and Repeat</button><button class="task-tab">Take an Interview</button></div>

function selectPracticeOption(btn){document.querySelectorAll('.practice-option').forEach(x=>x.classList.remove('selected'));btn.classList.add('selected')}
function checkPracticeAnswer(type){try{const run=window._toeflRun;if(!run){toast('Pratik oturumu bulunamadı.');return}const selected=document.querySelector('.practice-option.selected');const box=document.getElementById('practiceFeedback');const next=document.getElementById('practiceNext');if(!selected){box.className='practice-feedback bad';box.textContent='Bir seçenek seç.';return}if(run.answered)return;run.answered=true;const chosen=Number(selected.dataset.i),q=run.bank[run.idx];document.querySelectorAll('.practice-option').forEach((b,i)=>{b.disabled=true;if(i===q.a)b.classList.add('correct');if(i===chosen&&chosen!==q.a)b.classList.add('wrong')});if(chosen===q.a){run.score++;box.className='practice-feedback good';box.innerHTML='✅ Doğru! '+esc(q.ex)}else{box.className='practice-feedback bad';box.innerHTML='❌ Bu kez olmadı. Doğru cevap: <b>'+esc(q.opts[q.a])+'</b><br>'+esc(q.ex)}if(run.idx<run.bank.length-1){next.textContent='Sonraki soru →';next.onclick=()=>{run.idx++;run.renderQ()}}else{next.textContent='Sonucu gör';next.onclick=()=>showToeflResult(run.type,run.score,run.bank.length)}}catch(e){const box=document.getElementById('practiceFeedback');if(box){box.className='practice-feedback bad';box.textContent='Kontrol sırasında bir hata oluştu. Lütfen tekrar deneyin.'}console.error(e)}}

async function translateWordToTurkish(word){
 try{
  const q=encodeURIComponent(word);
  const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=tr&dt=t&q=${q}`;
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),5000);
  const r=await fetch(url,{signal:controller.signal});clearTimeout(timer);
  if(!r.ok)return '';
  const j=await r.json();
  return (j?.[0]||[]).map(x=>x?.[0]||'').join('').trim();
 }catch(e){return ''}
}
function guessCategory(word,definition){
 const text=((word||'')+' '+(definition||'')).toLowerCase();
 if(/bank|finance|loan|deposit|investment|branch|customer|account|payment|interest|credit|fund|money/.test(text))return 'Banking';
 if(/business|company|market|sales|management|employee|project|strategy/.test(text))return 'Business';
 if(/toefl|academic|university|research|lecture|study|science|environment|theory|evidence|analysis/.test(text))return 'TOEFL Academic';
 return 'General English';
}
async function fetchJson(url, ms=6000){
 try{
  const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),ms);
  const r=await fetch(url,{signal:controller.signal}); clearTimeout(timer);
  if(!r.ok)return null; return await r.json();
 }catch(e){return null}
}
async function enrichRelations(word){
 const syn=await fetchJson('https://api.datamuse.com/words?rel_syn='+encodeURIComponent(word)+'&max=8');
 const ant=await fetchJson('https://api.datamuse.com/words?rel_ant='+encodeURIComponent(word)+'&max=8');
 return {
  synonyms:Array.isArray(syn)?syn.map(x=>x.word).filter(Boolean).join(', '):'',
  antonyms:Array.isArray(ant)?ant.map(x=>x.word).filter(Boolean).join(', '):''
 };
}
function chooseDefinition(meanings){
 for(const m of (meanings||[])){
  const d=(m.definitions||[])[0]; if(d?.definition)return d.definition;
 }
 return '';
}
function chooseExample(meanings){
 for(const m of (meanings||[])){
  const d=(m.definitions||[]).find(x=>x?.example); if(d?.example)return d.example;
 }
 return '';
}
function collectRelations(meanings, key){
 const arr=[]; (meanings||[]).forEach(m=>(m.definitions||[]).forEach(d=>(d[key]||[]).forEach(x=>arr.push(x))));
 return [...new Set(arr)].slice(0,8).join(', ');
}

function rateWord(encoded,quality){
 const word=decodeURIComponent(encoded),w=words.find(x=>x.word===word);if(!w)return;
 const now=Date.now();
 if(quality==='again'){
   w.repetitions=0;w.interval=0;w.reviewLevel='Unutuldu';
   w.nextReview=new Date(now+10*60*1000).toISOString();
 }
 if(quality==='hard'){
   w.repetitions=Math.max(0,w.repetitions||0);w.interval=1;w.reviewLevel='Zorlanıyorum';
   w.nextReview=new Date(now+24*60*60*1000).toISOString();
 }
 if(quality==='good'){
   w.repetitions=(w.repetitions||0)+1;
   const levels=[1,3,7,14,30];
   w.interval=levels[Math.min(w.repetitions-1,levels.length-1)];
   w.reviewLevel=w.interval>=14?'Güçlü':'Öğreniliyor';
   w.nextReview=new Date(now+w.interval*24*60*60*1000).toISOString();
 }
 w.lastReviewed=new Date(now).toISOString();
 w.reviewCount=(w.reviewCount||0)+1;
 save();showReview(0);
}

function quiz(m){
 if(!words.length){
  m.innerHTML=`<h1>Quiz</h1><div class="sub">Henüz kendi kelimelerin yok.</div><div class="card empty">Önce birkaç kelime ekleyelim. 🚀</div><button class="btn primary" style="width:100%" onclick="nav('add')">＋ İlk kelimeyi ekle</button>`;
  return;
 }
 const w=words[(quizIndex)%words.length];
 const allMeanings=words.map(x=>x.meaning).filter(Boolean);
 let choices=[w.meaning];
 while(choices.length<4 && allMeanings.length){
   const candidate=allMeanings[Math.floor(Math.random()*allMeanings.length)];
   if(!choices.includes(candidate)) choices.push(candidate);
   if(choices.length>=Math.min(4,allMeanings.length)) break;
 }
 choices=choices.sort(()=>Math.random()-.5);
 quizAnswered=false;

 const sessionLabel=quizSession?`TOEFL Sprint • ${quizQ+1}/${quizTotal}`:`Soru ${quizIndex+1} • Skor ${quizScore}`;
 m.innerHTML=`<h1>Quiz</h1><div class="sub">${sessionLabel} • Skor ${quizSession?quizCorrectSession:quizScore}</div>

 </div>
 <div class="quiz-tools">
   <button class="smallbtn ${quizSession?'active':''}" onclick="startToeflSprint()">🎯 TOEFL Sprint</button>
   ${quizSession?`<button class="smallbtn" onclick="endSprint()">✕ Bitir</button>`:''}
 </div>
 <div class="pill" style="margin-top:18px">${esc(w.category||'TOEFL Academic')} · ${esc(w.difficulty||'Orta')}</div>

 <div class="choice-grid">
 ${choices.map(c=>`<button class="choice" onclick='answerChoice(${JSON.stringify(c)},${JSON.stringify(w.meaning)})'>${esc(quizMode==='meaning'?c:reverseChoice(c))}</button>`).join('')}
 </div>
 <div id="quizResult"></div>
 </div>`;
}
function reverseChoice(c){
 const hit=words.find(w=>w.meaning===c);
 return hit?hit.word:c;
}
function setQuizMode(mode){quizMode=mode;quiz(document.getElementById('main'))}
function startToeflSprint(){
 if(!words.length){toast('Önce kelime ekle.');return}
 quizSession=true;quizQ=0;quizCorrectSession=0;quizIndex=Math.floor(Math.random()*words.length);
 quizMode=['meaning','reverse'][Math.floor(Math.random()*2)];
 quiz(document.getElementById('main'));
}
function endSprint(){
 quizSession=false;quizQ=0;quizCorrectSession=0;quiz(document.getElementById('main'));
}
function answerChoice(selected,correct){
 if(quizAnswered)return;
 quizAnswered=true;
 const ok=selected===correct;
 const w=words[quizIndex%words.length];
 if(ok){quizScore++;w.quizCorrect=(w.quizCorrect||0)+1;if(quizSession)quizCorrectSession++}
 else{w.quizWrong=(w.quizWrong||0)+1}
 save();
 document.querySelectorAll('.choice').forEach(btn=>{
   const txt=btn.textContent.trim();
   const expected=quizMode==='meaning'?correct:reverseChoice(correct);
   if(txt===expected)btn.classList.add('correct');
   if(txt=== (quizMode==='meaning'?selected:reverseChoice(selected)) && !ok)btn.classList.add('wrong');
   btn.disabled=true;
 });
 const resultText=ok?'✅ Doğru!':'❌ Bu sefer olmadı.';
 const nextAction=quizSession && quizQ+1>=quizTotal
   ? `<button class="btn primary" style="width:100%;margin-top:10px" onclick="finishSprint()">🏁 Sprint sonucunu gör</button>`
   : `<button class="btn secondary" style="width:100%;margin-top:10px" onclick="quizIndex++;if(quizSession)quizQ++;quiz(document.getElementById('main'))">Sonraki soru →</button>`;
 document.getElementById('quizResult').innerHTML=`<div class="info ${ok?'success':'error'}">${resultText}<br><b>${esc(w.word)}</b> → ${esc(w.meaning)}</div>${nextAction}`;
}
function finishSprint(){
 const score=quizCorrectSession, total=quizTotal, pct=Math.round(score/total*100);
 quizSession=false;
 document.getElementById('main').innerHTML=`<h1>🎯 Sprint tamamlandı</h1><div class="sub">10 soruluk TOEFL kelime çalışması</div>
 <div class="card sprint-result"><div class="bigscore">${pct}%</div><h2>${score} / ${total} doğru</h2>
 <div class="meta">${pct>=80?'Çok iyi gidiyorsun!':'Bir tur daha tekrar ederek güçlendirebilirsin.'}</div>
 <div class="btnrow" style="margin-top:20px"><button class="btn primary" onclick="startToeflSprint()">Tekrar sprint</button><button class="btn secondary" onclick="nav('stats')">İlerlemeyi gör</button></div></div>`;
}

let readingText='', readingWords=[], selectedReading=new Set(), readingFile=null;

const commonWords=new Set(('the a an and or but if then than of to in on at for from by with without as is are was were be been being this that these those it its they them their there here into about after before during while which who whom what when where why how can could may might must should would will shall do does did done have has had having not no yes very more most some any each every both either neither other another such only also too so because through over under between among against per as we your our my his her their i you he she me him us'.split(/\s+/)));
const readingNoise=new Set(('reg section question questions answer passage first second third fourth fifth page paragraph number text www com http https century king god sun moon'.split(/\s+/)));
const academicBoost=new Set(Object.keys(fallback).concat(('archaeology recovery analysis material culture excavated restored antiquarian conducted detailed investigations systematic burial discipline recognized evidence research method theory finding findings significant substantial mitigate derive demonstrate interpret assess imply subsequent sufficient fundamental empirical'.split(/\s+/))));

function normalizeToken(s){return s.toLowerCase().replace(/[^a-z'-]/g,'').trim()}
function candidateScore(w){
  let score=0;
  if(academicBoost.has(w))score+=5;
  if(fallback[w])score+=4;
  if(w.length>=7)score+=2;
  if(w.length>=10)score+=1;
  return score;
}
function candidateReadingWords(){
  return [...new Set(readingWords.map(normalizeToken)
    .filter(w=>w.length>=5 && !commonWords.has(w) && !readingNoise.has(w) && !words.some(x=>x.word===w)))]
    .filter(w=>candidateScore(w)>=5)
    .sort((a,b)=>candidateScore(b)-candidateScore(a) || b.length-a.length || a.localeCompare(b));
}

async function runOCR(file){
 if(!file)return;
 readingFile=file; readingText=''; readingWords=[]; selectedReading=new Set();
 const status=document.getElementById('ocrStatus');
 status.innerHTML='🔎 Görsel okunuyor...';
 try{
   const result=await Tesseract.recognize(file,'eng',{logger:msg=>{
     if(msg.status==='recognizing text' && msg.progress) status.innerHTML=`🔎 Metin okunuyor... ${Math.round(msg.progress*100)}%`;
   }});
   readingText=result.data.text||'';
   readingWords=(readingText.match(/[A-Za-z][A-Za-z'-]*/g)||[]);
   status.innerHTML=`✅ Metin okundu. ${readingWords.length} kelime bulundu.`;
   renderReadingResult();
 }catch(e){
   status.innerHTML='❌ Görsel okunamadı. Daha net bir ekran görüntüsü deneyebilirsin.';
 }
}
function renderReadingResult(){
 const box=document.getElementById('readingResult'); if(!box)return;
 const candidates=candidateReadingWords();
 const spans=(readingText.match(/\s+|[A-Za-z][A-Za-z'-]*|[^A-Za-z\s]+/g)||[]).map(token=>{
   const n=normalizeToken(token);
   if(!n)return esc(token);
   const isSel=selectedReading.has(n);
   const isCandidate=candidates.includes(n);
   const cls=isSel?'reading-word selected':(isCandidate?'reading-word candidate':'reading-word');
   return `<button class="${cls}" onclick="toggleReadingWord('${encodeURIComponent(n)}')" title="Kelimeyi seç">${esc(token)}</button>`;
 }).join('');
 box.innerHTML=`<div class="card">
 <div class="section-title">📄 Okunan metin</div>
 <div class="meta" style="margin-bottom:14px">Yeşil kelimeler yüksek güvenli TOEFL adaylarıdır. Metindeki diğer kelimelere de dokunarak kendin seçim yapabilirsin. VocaMate sen onaylamadan hiçbir kelimeyi listeye eklemez.</div>

  ${candidates.length?`<button class="btn secondary" style="width:100%;margin-top:12px" onclick="selectTopReadingCandidates()">⭐ İlk ${Math.min(10,candidates.length)} adayı seç</button>`:''}

  <div class="section-title">➕ Seçilen kelimeler</div>

 ${selectedReading.size?`<button class="btn primary" style="width:100%;margin-top:16px" onclick="prepareReadingSelected()">Seçilenleri listeye hazırla →</button>`:''}
 </div>`;
}
function selectTopReadingCandidates(){const candidates=candidateReadingWords().slice(0,10);candidates.forEach(w=>selectedReading.add(w));renderReadingResult();}

function toggleReadingWord(encoded){
 const w=decodeURIComponent(encoded); if(!w)return;
 if(selectedReading.has(w))selectedReading.delete(w); else selectedReading.add(w);
 renderReadingResult();
}

function readingSentenceFor(word){
 const text=readingText||'';
 const parts=text.split(/(?<=[.!?])\s+/).filter(Boolean);
 const hit=parts.find(s=>new RegExp(`\\b${word.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'i').test(s));
 if(hit)return hit.trim();
 const idx=readingWords.findIndex(x=>normalizeToken(x)===word);
 if(idx<0)return '';
 return readingWords.slice(Math.max(0,idx-6),Math.min(readingWords.length,idx+7)).join(' ');
}
async function translateContextToTurkish(word, sentence){
 if(!sentence)return '';
 try{
   const phrase=sentence.length>500?sentence.slice(0,500):sentence;
   const q=encodeURIComponent(phrase);
   const url=`https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=tr&dt=t&q=${q}`;
   const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),7000);
   const r=await fetch(url,{signal:controller.signal}); clearTimeout(timer);
   if(!r.ok)return '';
   const j=await r.json();
   const out=(j?.[0]||[]).map(x=>x?.[0]||'').join('').trim();
   return out;
 }catch(e){return ''}
}
async function contextualMeaning(word, sentence){
 const d=fallback[word]||{};
 const translated=await translateContextToTurkish(word,sentence);
 if(!translated)return d.meaning||'';
 // Keep the concise dictionary meaning when available; otherwise use a context-aware phrase translation
 // so the user does not have to type a Turkish meaning manually.
 if(d.meaning)return d.meaning;
 return translated;
}

function saveReadingSelected(){

 selected.forEach((w,i)=>{
   const meaning=document.getElementById(`rmeaning_${i}`)?.value.trim();

   if(!meaning)return;
   const d=fallback[w]||{};
   const contextSentence=readingSentenceFor(w);
   const old=words.find(x=>x.word===w);
   words=words.filter(x=>x.word!==w);
   words.push({word:w,type:d.type||'word',phonetic:d.phonetic||'',definition:d.definition||'',meaning,example,userExample,note:'Reading bağlamından eklendi',readingContext:contextSentence,readingSource:'Reading Lab',synonyms:d.synonyms||'',antonyms:d.antonyms||'',category:'TOEFL Academic',difficulty:document.getElementById(`rdiff_${i}`)?.value||'Orta',added:old?.added||today(),interval:old?.interval||0,repetitions:old?.repetitions||0,nextReview:old?.nextReview||new Date().toISOString(),reviewLevel:old?.reviewLevel||'Öğreniliyor',reviewCount:old?.reviewCount||0,lastReviewed:old?.lastReviewed||'',quizCorrect:old?.quizCorrect||0,quizWrong:old?.quizWrong||0});
   added++;
 });
 save();

function setVocabFilter(f){vocabFilter=f;stats(document.getElementById('main'))}
function filterWords(){vocabSearch=(document.getElementById('vocabSearch')?.value||'').trim().toLowerCase();stats(document.getElementById('main'))}
function wordStatus(w){
  if(w.reviewLevel==='Güçlü')return {label:'Güçlü',cls:'green'};
  if(w.reviewLevel==='Unutuldu')return {label:'Unutuldu',cls:'red'};
  if(w.reviewLevel==='Zorlanıyorum')return {label:'Zorlanıyorum',cls:'yellow'};
  return {label:'Öğreniliyor',cls:'yellow'};
}
function filterMatch(w){
  if(vocabFilter==='all')return true;
  if(vocabFilter==='due')return !w.nextReview||new Date(w.nextReview)<=new Date();
  if(vocabFilter==='strong')return w.reviewLevel==='Güçlü';
  if(vocabFilter==='toefl')return (w.category||'')==='TOEFL Academic'||w.sourceContext==='TOEFL';
  if(vocabFilter.startsWith('source:'))return (w.sourceContext||'')===vocabFilter.slice(7);
  if(vocabFilter==='general')return ['General English','Daily English'].includes(w.category||'');
  return true;
}
function stats(m){
  const due=dueWords(), strong=words.filter(w=>w.reviewLevel==='Güçlü'), learned=words.filter(w=>(w.repetitions||0)>0), forgotten=words.filter(w=>w.reviewLevel==='Unutuldu');
  let list=words.slice().reverse().filter(w=>{
    const q=!vocabSearch||w.word.toLowerCase().includes(vocabSearch)||(w.meaning||'').toLowerCase().includes(vocabSearch)||(w.definition||'').toLowerCase().includes(vocabSearch);
    return q&&filterMatch(w);
  });
  const chips=[['all','Tümü'],['due','🔁 Tekrar'],['strong','🟢 Güçlü'],['toefl','🎓 TOEFL'],['source:Reading','📖 Reading'],['source:Listening','🎧 Listening'],['source:Speaking','🎤 Speaking'],['source:Writing','✍️ Writing'],['general','🌎 Genel']];
  m.innerHTML=`<h1>📚 Kelime hazinem</h1><div class="sub">Kelime öğrenme merkezinin tamamı burada. Ara, filtrele, kelimeye dokun ve detaylarını gör.</div>
  <div class="library-hero"><div class="eyebrow">VOCABULARY LIBRARY</div><h2>${words.length} kelime</h2><p>${due.length?`Bugün ${due.length} kelime tekrar bekliyor.`:'Bugün tekrar bekleyen kelime yok. Yeni kelimeler ekleyebilirsin.'}</p><div class="library-stats"><div class="library-stat"><strong>${due.length}</strong><span>Tekrar</span></div><div class="library-stat"><strong>${strong.length}</strong><span>Güçlü</span></div><div class="library-stat"><strong>${learned.length}</strong><span>Çalışılmış</span></div></div></div>
  <div class="card"><label style="margin-top:0">🔎 Kelime ara</label><input id="vocabSearch" value="${esc(vocabSearch)}" placeholder="Kelime, anlam veya tanım..." oninput="filterWords()"><div class="library-filters" style="margin-top:12px">${chips.map(([k,l])=>`<button class="library-filter ${vocabFilter===k?'active':''}" onclick="setVocabFilter('${k}')">${l}</button>`).join('')}</div></div>
  <div class="vocab-summary"><span><b>${list.length}</b> kelime gösteriliyor</span><span>${forgotten.length} unutuldu</span></div>
  <div class="card" style="padding:8px 15px">${list.length?list.map(w=>{const st=wordStatus(w), dueNow=!w.nextReview||new Date(w.nextReview)<=new Date(); const source=w.sourceContext||w.category||'General English'; return `<div class="library-word" onclick="openWordDetail('${encodeURIComponent(w.word)}')"><div class="library-word-main"><div class="library-word-name"><span class="status-dot dot-${st.cls}"></span>${esc(w.word)} <button class="speak" onclick="event.stopPropagation();speakWord(${JSON.stringify(w.word)})">🔊</button></div><div class="library-word-meaning">${esc(w.meaning||'Anlam eklenmedi')}</div><div class="library-word-meta"><span class="source-pill">${esc(source)}</span><span class="badge">${esc(w.difficulty||'Orta')}</span><span class="badge">${esc(st.label)}</span>${dueNow?'<span class="badge" style="background:#fff4dc;color:#8a6411">Tekrar zamanı</span>':''}</div></div><div class="library-arrow">›</div></div>`}).join(''):'<div class="empty">Bu filtrede kelime bulunamadı.<br><br>＋ Yeni bir kelime ekleyelim.</div>'}</div>
  <div class="btnrow" style="margin-top:12px"><button class="btn primary" style="flex:1" onclick="nav('add')">＋ Yeni kelime ekle</button><button class="btn secondary" style="flex:1" onclick="startReview()">🧠 Tekrar</button></div>`;
}
function openWordDetail(encoded){const word=decodeURIComponent(encoded);if(!words.some(w=>w.word===word))return;pushPage('wordDetail');window._detailWord=word;render();}
function wordDetail(m){
 const w=words.find(x=>x.word===window._detailWord); if(!w){nav('stats');return;}
 const st=wordStatus(w), dueNow=!w.nextReview||new Date(w.nextReview)<=new Date();
 const next=w.nextReview?new Date(w.nextReview).toLocaleDateString('tr-TR',{day:'2-digit',month:'long'}):'İlk tekrar';
 const source=w.sourceContext||w.category||'General English';
 const exWord=esc(w.word);
 const saved=w.userExample?`<div class="v22-saved">✅ <b>Kayıtlı cümlen:</b> ${esc(w.userExample)}</div>`:'';
 const speakingUse=`One substantial advantage is that this approach can improve the overall result.`.replace(/substantial/gi,w.word);
 const writingUse=`There has been a substantial increase in the number of people using this approach.`.replace(/substantial/gi,w.word);

 const sentenceDone=!!(w.userExample&&w.userExample.trim());
 const quizDone=(w.quizCorrect||0)>0;
 const reviewDone=(w.repetitions||0)>0;
 const pronunciationDone=!!w.pronunciationPracticed;
 const learnedDone=!!w.meaning;
 const mastery=masteryInfo(w);
 const steps=[
   {done:learnedDone,icon:'📖',title:'Anlamı öğren',sub:'Türkçe ve İngilizce anlamı incele',action:''},
   {done:pronunciationDone,icon:'🔊',title:'Dinle & söyle',sub:'Kelimeyi sesli olarak tekrar et',action:`<button onclick="practicePronunciation(${JSON.stringify(w.word)})">Başlat</button>`},
   {done:sentenceDone,icon:'✍️',title:'Kendi cümleni kur',sub:sentenceDone?'Cümlen kaydedildi':'Kelimeyi kendi cümlende kullan',action:`<button onclick="document.getElementById('activeSentence')?.focus()">Yaz</button>`},
   {done:quizDone,icon:'🎯',title:'Quizde göster',sub:quizDone?'Quizde doğru yaptın':'Kelimeyi quizde hatırla',action:`<button onclick="nav('quiz')">Quiz</button>`},
   {done:reviewDone,icon:'🧠',title:'Tekrarla',sub:reviewDone?'En az bir başarılı tekrar var':'Spaced repetition ile pekiştir',action:`<button onclick="startSingleReview('${encodeURIComponent(w.word)}')">Tekrar</button>`}
 ];
 const doneCount=steps.filter(s=>s.done).length, pct=Math.round(doneCount/steps.length*100);
 const pathHtml=steps.map(s=>`<div class="v23-step ${s.done?'done':''}"><div class="vicon">${s.done?'✓':s.icon}</div><div><b>${s.title}</b><span>${s.sub}</span></div>${s.action||''}</div>`).join('');
 const mission=sentenceDone
   ? `Bu kelimeyi artık pasif olarak tanımaktan çıkardın. Şimdi ${esc(w.word)} kelimesini bir TOEFL Speaking veya Writing cevabında kullan.`
   : `Bugünün mini görevi: <b>${exWord}</b> kelimesini kullanarak en az 6 kelimelik doğal bir İngilizce cümle yaz.`;

 m.innerHTML=`
 <div class="word-profile"><div class="profile-word">${exWord} <button class="speak" onclick="speakWord(${JSON.stringify(w.word)})">🔊</button></div><div class="profile-meta">${esc(w.phonetic||'Telaffuz yok')} <span>•</span> ${esc(w.type||'word')}</div><div style="margin-top:12px"><span class="source-pill">${esc(source)}</span> <span class="badge">${esc(w.category||'General English')}</span> <span class="badge">${esc(w.difficulty||'Orta')}</span> <span class="badge">${esc(st.label)}</span></div><div class="pronounce-row"><button class="mini-action" onclick="speakWord(${JSON.stringify(w.word)})">🔊 Dinle</button><button class="mini-action" onclick="practicePronunciation(${JSON.stringify(w.word)})">🎤 Kelimeyi söyle</button></div></div>
 ${dueNow?'<div class="review-banner">🔔 Bu kelime bugün tekrar bekliyor.</div>':`<div class="info">🔁 Sonraki tekrar: <b>${next}</b></div>`}

 <div class="v23-path">
   <div class="v23-path-head"><div><h3>🧠 Kelime öğrenme yolu</h3><p>Bir kelimeyi bilmek = görmek değil, aktif kullanabilmek.</p></div><div class="v23-score">${doneCount}/5</div></div>
   <div class="v23-progress"><span style="width:${pct}%"></span></div>
   <div class="v23-steps">${pathHtml}</div>
 </div>

 <div class="mastery-card"><div class="mastery-head"><div><div class="mastery-title">⭐ Vocabulary Mastery</div><div class="mastery-sub">Hedef: kelimeyi sadece tanımak değil, bağımsız olarak kullanabilmek.</div></div><div class="mastery-level">${mastery.level}</div></div><div class="mastery-bar"><span style="width:${mastery.pct}%"></span></div><div class="mastery-stages">${mastery.stages.map((x,i)=>`<div class="mastery-stage ${x.done?'done':''} ${i===mastery.index?'current':''}"><div class="mastery-dot">${x.done?'✓':i+1}</div><div>${x.label}</div></div>`).join('')}</div></div>

 <div class="profile-grid"><div class="profile-box highlight"><div class="profile-label">🇹🇷 Türkçe anlam</div><div style="font-size:20px;font-weight:800">${esc(w.meaning||'Anlam eklenmedi')}</div></div><div class="profile-box"><div class="profile-label">📖 İngilizce tanım</div><div>${esc(w.definition||'Tanım bulunamadı.')}</div></div>${w.example?`<div class="profile-box"><div class="profile-label">📘 VocaMate örnek cümlesi</div><div>${esc(w.example)}</div></div>`:''}${w.readingContext?`<div class="profile-box"><div class="profile-label">📖 Reading bağlamı</div><div>${esc(w.readingContext)}</div></div>`:''}${w.synonyms?`<div class="profile-box"><div class="profile-label">🔗 Synonyms</div><div>${esc(w.synonyms)}</div></div>`:''}${w.antonyms?`<div class="profile-box"><div class="profile-label">↔️ Antonyms</div><div>${esc(w.antonyms)}</div></div>`:''}${w.note?`<div class="profile-box"><div class="profile-label">📝 Notum</div><div>${esc(w.note)}</div></div>`:''}</div>

 <div class="v23-mission"><div class="kicker">BUGÜNÜN KELİME GÖREVİ</div><h3>${sentenceDone?'Bir adım daha!':'Kelimeyi aktif hale getir'}</h3><p>${mission}</p>${!sentenceDone?`<button onclick="document.getElementById('activeSentence')?.focus()">✍️ Cümlemi yaz</button>`:`<button onclick="startSingleReview('${encodeURIComponent(w.word)}')">🧠 Tekrar et</button>`}</div>

 <div class="v22-focus"><div class="v22-focus-head"><div class="v22-focus-icon">✍️</div><div><h3>Aktif kullanım</h3><div class="small">Vocabulary'nin en önemli adımı: kelimeyi sen kullan.</div></div></div><p>${`Write one natural English sentence using <b>${exWord}</b>. Try to use the word in the same meaning shown above.`}</p><div class="v22-prompt">💡 <b>Mini görev:</b> ${w.word} kelimesini bugün bir konuşmada veya yazıda kullan.</div><textarea id="activeSentence" class="sentence-box" style="margin-top:10px" placeholder="Write your own sentence with ${exWord}...">${esc(w.userExample||'')}</textarea><button class="ai-coach-btn ai-coach-btn-main" onclick="aiCoachSentence('${encodeURIComponent(w.word)}')">🤖 AI Cümle Koçu <span>Grammar • Doğallık • Öneri</span></button><div class="v22-row"><button class="listen" onclick="saveActiveSentence('${encodeURIComponent(w.word)}')">💾 Kaydet</button><button class="practice" onclick="checkActiveSentence('${encodeURIComponent(w.word)}')">✓ Cümlemi kontrol et</button></div><div id="sentenceFeedback"></div>${saved}</div>

 <div class="active-learning"><h3>🎓 TOEFL'da kullan</h3><p>Öğrendiğin kelimeyi sınavın Speaking ve Writing cevaplarına taşı.</p><div class="toefl-use"><div class="use-card"><b>🎤 Speaking</b><span>${esc(speakingUse)}</span></div><div class="use-card"><b>✍️ Writing</b><span>${esc(writingUse)}</span></div></div><button class="btn primary" style="width:100%;margin-top:10px" onclick="markToeflUse('${encodeURIComponent(w.word)}')">🎓 Bu kelimeyi TOEFL'da kullandım</button></div>
 <div class="stats" style="margin-top:14px"><div class="stat"><strong>${w.reviewCount||0}</strong><span>Tekrar sayısı</span></div><div class="stat"><strong>${w.quizCorrect||0}</strong><span>Quiz doğru</span></div><div class="stat"><strong>${w.repetitions||0}</strong><span>Başarılı tekrar</span></div><div class="stat"><strong>${w.interval||0} gün</strong><span>Aralık</span></div></div>
 <div class="detail-actions" style="margin-top:14px"><button class="btn primary" onclick="startSingleReview('${encodeURIComponent(w.word)}')">🧠 Şimdi tekrar et</button><button class="btn secondary" onclick="editWord('${encodeURIComponent(w.word)}')">✏️ Düzenle</button></div><button class="delete" style="width:100%;margin-top:10px;padding:14px" onclick="deleteWord('${encodeURIComponent(w.word)}')">🗑️ Kelimeyi sil</button>`;
}
function saveActiveSentence(encoded){const word=decodeURIComponent(encoded),w=words.find(x=>x.word===word),input=document.getElementById('activeSentence');if(!w||!input)return;w.userExample=input.value.trim();save();toast('✍️ Kendi cümlen kaydedildi');}
function masteryInfo(w){
 const stages=[
  {label:'Tanıyorum',done:!!w.meaning},
  {label:'Telaffuz',done:!!w.pronunciationPracticed},
  {label:'Cümlede',done:!!(w.userExample&&w.userExample.trim())},
  {label:'Aktif',done:(w.activeSentenceScore||0)>=70},
  {label:'TOEFL',done:(w.toeflUseCount||0)>0}
 ];
 const done=stages.filter(x=>x.done).length;
 let level='Tanıyorum',index=0;
 if(done>=5){level='TOEFL kullanıyorum';index=4}
 else if(done>=4){level='Aktif kullanıyorum';index=3}
 else if(done>=3){level='Cümlede kullanıyorum';index=2}
 else if(done>=2){level='Tanıyorum + telaffuz';index=1}
 const pct=Math.round(done/5*100);
 return {level,index,pct,stages};
}
function checkActiveSentence(encoded){
 const word=decodeURIComponent(encoded),w=words.find(x=>x.word===word),input=document.getElementById('activeSentence'),box=document.getElementById('sentenceFeedback');
 if(!w||!input||!box)return;
 const text=input.value.trim(), target=word.toLowerCase();
 if(!text){box.className='sentence-feedback feedback-warn';box.innerHTML='💡 Önce kelimeyi kullanarak bir İngilizce cümle yaz.';return}
 const hasWord=new RegExp('\\b'+target.replace(/[.*+?^${}()|[\\]\\]/g,'\\$&')+'(?:s|es|ed|ing)?\\b','i').test(text);
 const wordsCount=text.split(/\\s+/).filter(Boolean).length;
 const hasCapital=/^[A-Z]/.test(text);
 const hasPunctuation=/[.!?]$/.test(text);
 const repeatedSpaces=/\\s{2,}/.test(text);
 const scoreParts=[]; let score=0;
 if(hasWord){score+=45;scoreParts.push('Kelime cümlede kullanılmış.')}else scoreParts.push('Hedef kelime cümlede görünmüyor.');
 if(wordsCount>=6){score+=20;scoreParts.push('Cümle yeterli uzunlukta.')}else scoreParts.push('Cümleyi biraz daha geliştir.');
 if(hasCapital){score+=10;scoreParts.push('Büyük harf kullanımı uygun.')}else scoreParts.push('Cümle başında büyük harf kullan.');
 if(hasPunctuation){score+=10;scoreParts.push('Noktalama işareti var.')}else scoreParts.push('Sonuna nokta, soru işareti veya ünlem ekle.');
 if(!repeatedSpaces)score+=5;
 if(/[.!?]/.test(text))score+=5;
 if(/\b(is|are|was|were|has|have|had|can|could|will|would|do|does|did|the|a|an)\b/i.test(text))score+=5;
 score=Math.min(100,score);
 w.userExample=text;w.activeSentenceScore=score;w.lastActivePractice=today();save();
 box.className=score>=70?'sentence-feedback feedback-good':'sentence-feedback feedback-warn';
 box.innerHTML=`<span class="feedback-score">${score}/100</span><br>${score>=70?'✅ <b>Temel kullanım başarılı.</b>':'🟡 <b>Biraz daha geliştir.</b>'}<ul class="feedback-list">${scoreParts.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><div class="active-tip">🤖 Daha ayrıntılı grammar, doğallık ve alternatif cümle için <b>AI Cümle Koçu</b>nu kullan.</div>`;
 if(currentPage==='wordDetail')setTimeout(()=>render(),900);
}

async function aiCoachSentence(encoded){
 const word=decodeURIComponent(encoded),w=words.find(x=>x.word===word),input=document.getElementById('activeSentence'),box=document.getElementById('sentenceFeedback');
 if(!w||!input||!box)return;
 const sentence=input.value.trim();
 if(!sentence){box.className='sentence-feedback feedback-warn';box.innerHTML='💡 Önce kendi cümleni yaz, sonra AI Cümle Koçu ile analiz edelim.';return}
 const endpoint=localStorage.getItem('vocamate_ai_endpoint')||'';
 if(!endpoint){
   box.className='ai-coach-box';
   box.innerHTML=`<h4>🤖 AI Cümle Koçu</h4><div class="ai-coach-grid"><div class="ai-coach-item"><b>Şu anki durum</b> Cümlen kaydedildi ve temel VocaMate kontrolünden geçti.</div><div class="ai-coach-item"><b>AI desteği</b> Gerçek AI analizi için VocaMate'ye güvenli bir backend bağlantısı eklememiz gerekiyor. API anahtarını uygulamanın içine koymayacağız.</div><div class="ai-coach-item"><b>Önerilen düzeltme</b> ${word==='substantial'&&/substantial time/i.test(sentence)?'“substantial amount of time” ifadesi daha doğal olabilir.':'AI bağlantısı kurulduğunda grammar, doğallık ve kelime anlamını ayrı ayrı analiz edecek.'}</div></div>`;
   return;
 }
 box.className='ai-coach-box';box.innerHTML='<div class="ai-loading"><span class="ai-dot"></span> AI cümleni analiz ediyor…</div>';
 try{
   const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({word,meaning:w.meaning||'',definition:w.definition||'',sentence})});
   if(!res.ok)throw new Error('AI endpoint '+res.status);
   const data=await res.json();
   const r=data.result||data;
   box.innerHTML=`<h4>🤖 AI Cümle Koçu</h4><div class="ai-coach-grid"><div class="ai-coach-item"><b>Değerlendirme</b>${esc(r.evaluation||'')}</div><div class="ai-coach-item"><b>Grammar</b>${esc(r.grammar||'')}</div><div class="ai-coach-item"><b>Doğallık</b>${esc(r.naturalness||'')}</div><div class="ai-coach-item"><b>Önerilen cümle</b><strong>${esc(r.corrected_sentence||sentence)}</strong></div><div class="ai-coach-item"><b>Neden?</b>${esc(r.explanation||'')}</div><div class="ai-coach-item"><b>TOEFL önerisi</b>${esc(r.toefl_tip||'')}</div></div>`;
   w.aiFeedback=r;w.aiCheckedAt=new Date().toISOString();w.userExample=sentence;save();
 }catch(e){box.innerHTML='<div class="ai-coach-item"><b>⚠️ AI bağlantısı kurulamadı</b> Şimdilik temel VocaMate kontrolünü kullanabilirsin. AI bağlantısını daha sonra tekrar deneyebiliriz.</div>';}
}
function practicePronunciation(word){const w=words.find(x=>x.word===word);if(w){w.pronunciationPracticed=true;save();}if('SpeechRecognition' in window || 'webkitSpeechRecognition' in window){const R=window.SpeechRecognition||window.webkitSpeechRecognition;const r=new R();r.lang='en-US';r.interimResults=false;r.maxAlternatives=1;r.onresult=e=>{const heard=(e.results[0][0].transcript||'').toLowerCase();const ok=heard.includes(word.toLowerCase());toast(ok?'🎉 Kelimeyi doğru söyledin!':'🔁 Bir kez daha dene.');};r.onerror=()=>toast('🎤 Ses tanıma bu tarayıcıda kullanılamıyor.');r.start();toast('🎤 Dinliyorum...');}else{toast('🔊 Telaffuz çalışması kaydedildi. Ses tanıma bu tarayıcıda desteklenmiyor.');}if(currentPage==='wordDetail')setTimeout(()=>render(),700)}
function markToeflUse(encoded){const word=decodeURIComponent(encoded),w=words.find(x=>x.word===word);if(!w)return;w.toeflUseCount=(w.toeflUseCount||0)+1;save();toast('🎓 TOEFL kullanımı kaydedildi');if(currentPage==='wordDetail')setTimeout(()=>render(),500);}
function startSingleReview(encoded){const word=decodeURIComponent(encoded);const w=words.find(x=>x.word===word);if(!w)return;w.nextReview=new Date().toISOString();save();nav('review');}
function editWord(encoded){const word=decodeURIComponent(encoded);const w=words.find(x=>x.word===word);if(!w)return;pushPage('add');render();setTimeout(()=>{const input=document.getElementById('wordInput');if(input){input.value=w.word;prepareWord().then(()=>{setTimeout(()=>{if(document.getElementById('meaning'))document.getElementById('meaning').value=w.meaning||'';if(document.getElementById('example'))document.getElementById('example').value=w.example||'';if(document.getElementById('userExample'))document.getElementById('userExample').value=w.userExample||'';if(document.getElementById('note'))document.getElementById('note').value=w.note||'';if(document.getElementById('category'))document.getElementById('category').value=w.category||'TOEFL Academic';if(document.getElementById('difficulty'))document.getElementById('difficulty').value=w.difficulty||'Orta'},250)})}},50)}
function deleteWord(encoded){const word=decodeURIComponent(encoded);words=words.filter(w=>w.word!==word);save();toast('Kelime silindi');if(currentPage==='wordDetail')nav('stats');else render()}
render();
updateBottomNav();
</script>
</body>
