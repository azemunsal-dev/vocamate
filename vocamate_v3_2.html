<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#23406f">
<title>VocaMate v3.2</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f5f7fb;color:#172033;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}
.app{max-width:540px;margin:auto;min-height:100vh;padding:20px 18px 96px}
header{display:flex;justify-content:space-between;align-items:center;margin:8px 0 28px}
.logo{font-size:34px;font-weight:800;color:#23406f}.streak{background:#fff;border-radius:30px;padding:13px 20px;font-weight:750;box-shadow:0 5px 18px #0000000c}
h1{font-size:40px;line-height:1.08;margin:0 0 10px}.sub{font-size:20px;color:#71809a;margin-bottom:25px}
.card{background:#fff;border-radius:28px;padding:25px;margin-bottom:18px;box-shadow:0 8px 28px #203b6810}
.goal{background:#23406f;color:#fff}.goalrow{display:flex;justify-content:space-between;font-size:21px;font-weight:750}
.bar{height:11px;background:#ffffff36;border-radius:10px;margin:22px 0 12px;overflow:hidden}.fill{height:100%;background:#6d92ed;border-radius:10px}
.btnrow{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-bottom:20px}
.btn{border:0;border-radius:20px;padding:17px 12px;font-size:18px;font-weight:750;cursor:pointer}.primary{background:#4772e6;color:#fff}.secondary{background:#fff;color:#23406f;border:1px solid #edf0f5}
.nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e9f0;z-index:5}
.navin{max-width:540px;width:100%;margin:auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{border:0;background:none;padding:9px 3px 11px;color:#75829a;font-size:12px;font-weight:700}
.nav button.active{color:#23406f}.navicon{font-size:19px;display:block;margin-bottom:2px}
.word{font-size:46px;font-weight:800;margin:12px 0 5px}.pill{display:inline-block;background:#edf2ff;color:#4772e6;padding:9px 15px;border-radius:16px;font-weight:750}
.meta{color:#71809a;font-size:18px}.meaning{font-size:24px;font-weight:750;margin:22px 0}
.example{background:#f5f7fb;border-radius:20px;padding:18px;font-size:18px;line-height:1.5}.tag{color:#4772e6;font-weight:800}
input,textarea,select{width:100%;border:1px solid #d9e0eb;border-radius:18px;padding:16px;font-size:18px;background:#fff;color:#172033}
textarea{min-height:95px;resize:vertical}label{display:block;font-weight:750;margin:16px 0 8px}
.searchrow{display:grid;grid-template-columns:1fr auto;gap:10px}.searchrow .btn{padding:15px 18px}
.info{background:#eef3ff;color:#4772e6;border-radius:18px;padding:14px;font-size:16px;margin-top:12px}
.success{background:#eaf8f1;color:#287957}.error{background:#fff0f0;color:#a44343}
.hidden{display:none!important}.resultgrid{display:grid;gap:10px;margin-top:18px}
.mini{background:#f7f8fb;border-radius:18px;padding:15px}.mini b{display:block;margin-bottom:5px}
.listitem{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:16px 0;border-bottom:1px solid #edf0f5}
.listitem:last-child{border-bottom:0}.delete{border:0;background:#fff0f0;color:#a44343;border-radius:12px;padding:9px 11px}
.empty{text-align:center;color:#71809a;padding:25px}.quizq{font-size:30px;font-weight:800}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f5f7fb;border-radius:20px;padding:20px}.stat strong{font-size:30px;display:block}
.review-actions{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:18px}
.review-actions button{border:0;border-radius:17px;padding:15px 6px;font-weight:750;font-size:14px}
.again{background:#fff0f0;color:#a44343}.hard{background:#fff6df;color:#8a6411}.good{background:#eaf8f1;color:#287957}
.due{background:#fff7e6;color:#8a6411;border-radius:14px;padding:10px 13px;font-weight:700;display:inline-block}
.progressline{display:flex;justify-content:space-between;color:#71809a;font-size:15px;margin-top:10px}
.toast{position:fixed;left:50%;bottom:82px;transform:translateX(-50%);background:#172033;color:#fff;padding:12px 18px;border-radius:15px;z-index:10;font-weight:650}
</style>
</head>
<body>
<div class="app">
<header><div class="logo">VocaMate</div><div class="streak">🔥 <span id="streak">1</span> gün</div></header>
<main id="main"></main>
</div>
<nav class="nav"><div class="navin">
<button data-page="home" class="active"><span class="navicon">🏠</span>Ana sayfa</button>
<button data-page="add"><span class="navicon">＋</span>Kelime ekle</button>
<button data-page="quiz"><span class="navicon">🎯</span>Quiz</button>
<button data-page="stats"><span class="navicon">📊</span>İlerleme</button>
</div></nav>
<div id="toast" class="toast hidden"></div>
<script>
const KEY='vocamate_words_v32', TARGET=20;
let words=JSON.parse(localStorage.getItem(KEY)||'[]');
let currentPage='home', quizIndex=0;

const fallback={
 substantial:{type:'adjective',phonetic:'/səˈstænʃəl/',definition:'of considerable importance, size, or worth',meaning:'önemli, kayda değer; büyük miktarda',example:'The project requires a substantial amount of time.',synonyms:'considerable, significant',antonyms:'insignificant, minor'},
 mitigate:{type:'verb',phonetic:'/ˈmɪtɪɡeɪt/',definition:'to make something less severe, harmful, or painful',meaning:'hafifletmek, azaltmak',example:'Governments should take measures to mitigate the effects of climate change.',synonyms:'alleviate, reduce',antonyms:'aggravate, intensify'},
 allocate:{type:'verb',phonetic:'/ˈæləkeɪt/',definition:'to give or distribute something for a particular purpose',meaning:'tahsis etmek, ayırmak',example:'The university allocated more funds to research.',synonyms:'assign, distribute',antonyms:'withhold'},
 inevitable:{type:'adjective',phonetic:'/ɪnˈevɪtəbəl/',definition:'certain to happen and impossible to avoid',meaning:'kaçınılmaz',example:'Some changes are inevitable.',synonyms:'unavoidable, certain',antonyms:'avoidable, uncertain'},
 enhance:{type:'verb',phonetic:'/ɪnˈhæns/',definition:'to improve the quality, value, or effectiveness of something',meaning:'geliştirmek, artırmak',example:'The new system will enhance customer experience.',synonyms:'improve, strengthen',antonyms:'weaken, reduce'}
};

function save(){localStorage.setItem(KEY,JSON.stringify(words))}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),2200)}
function today(){return new Date().toISOString().slice(0,10)}
function dueWords(){return words.filter(w=>!w.nextReview||new Date(w.nextReview)<=new Date())}
function nav(page){currentPage=page;document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));render()}
document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>nav(b.dataset.page));

function render(){
 const m=document.getElementById('main');
 if(currentPage==='home')home(m);
 if(currentPage==='add')add(m);
 if(currentPage==='quiz')quiz(m);
 if(currentPage==='stats')stats(m);
}

function home(m){
 const addedToday=words.filter(w=>w.added===today()).length, due=dueWords();
 const pct=Math.min(100,addedToday/TARGET*100);
 m.innerHTML=`<h1>Bugünkü çalışma</h1><div class="sub">Kısa çalış, sık tekrar et.</div>
 <div class="card goal"><div class="goalrow"><span>Günlük hedef</span><span>${addedToday} / ${TARGET}</span></div>
 <div class="bar"><div class="fill" style="width:${pct}%"></div></div><div>${Math.max(0,TARGET-addedToday)} kelime daha</div></div>
 <div class="btnrow"><button class="btn primary" onclick="startLearning()">▶ Öğren</button><button class="btn secondary" onclick="startReview()">↻ Tekrar et</button></div>
 <div class="card"><span class="pill">🧠 Akıllı tekrar</span><h2 style="margin-bottom:8px">${due.length?due.length+' kelime tekrar bekliyor':'Bugün tekrar bekleyen kelime yok'}</h2>
 <div class="meta">${due.length?'Unutmaya başlamadan önce tekrar edelim.':'Yeni kelime ekleyebilir veya quiz yapabilirsin.'}</div>
 ${due.length?`<button class="btn primary" style="width:100%;margin-top:18px" onclick="startReview()">Tekrara başla →</button>`:''}</div>
 ${words.length?wordCard(words[words.length-1]):sampleCard()}`;
}
function sampleCard(){return `<div class="card"><span class="pill">Örnek TOEFL kelimesi</span><div class="word">mitigate</div><div class="meta">/ˈmɪtɪɡeɪt/ • verb</div><div class="meaning">hafifletmek, azaltmak</div><div class="example">Governments should take measures to <span class="tag">mitigate</span> the effects of climate change.</div></div>`}
function wordCard(w){return `<div class="card"><span class="pill">Son eklenen</span><div class="word">${esc(w.word)}</div><div class="meta">${esc(w.phonetic||'')} • ${esc(w.type||'')}</div><div class="meaning">${esc(w.meaning||'Türkçe anlam eklenmedi')}</div><div class="example">${esc(w.example||w.definition||'')}</div>
<div class="progressline"><span>Tekrar aralığı</span><b>${intervalLabel(w.interval||0)}</b></div></div>`}

function add(m){
 m.innerHTML=`<h1>Akıllı kelime ekle</h1><div class="sub">Kelimeyi yaz, VocaMate bilgileri getirsin.</div>
 <div class="card"><label>İngilizce kelime *</label><div class="searchrow"><input id="wordInput" placeholder="Örn. substantial" autocomplete="off"><button class="btn primary" onclick="prepareWord()">🤖 Hazırla</button></div>
 <div class="meta" style="margin-top:12px">İnternet gerekir. Yaygın TOEFL kelimelerinde yedek sözlük de bulunur.</div><div id="result"></div></div>
 <button class="btn secondary" style="width:100%" onclick="nav('stats')">📚 Kelimelerimi gör</button>`;
}
async function prepareWord(){
 const input=document.getElementById('wordInput'), result=document.getElementById('result'), word=input.value.trim().toLowerCase();
 if(!word){toast('Önce bir kelime yaz.');return}
 result.innerHTML='<div class="info">🔎 Kelime bilgileri aranıyor...</div>';
 let data=null;
 if(fallback[word])data=fallback[word];
 else{
  try{
   const controller=new AbortController(), timer=setTimeout(()=>controller.abort(),5000);
   const r=await fetch('https://api.dictionaryapi.dev/api/v2/entries/en/'+encodeURIComponent(word),{signal:controller.signal});clearTimeout(timer);
   if(r.ok){const json=await r.json(),x=json[0],ms=x.meanings||[],first=ms[0]||{},d=(first.definitions||[])[0]||{};
    data={type:first.partOfSpeech||'',phonetic:x.phonetic||(x.phonetics||[]).find(p=>p.text)?.text||'',definition:d.definition||'',meaning:'',example:d.example||'',synonyms:(d.synonyms||[]).join(', '),antonyms:(d.antonyms||[]).join(', ')}}
  }catch(e){}
 }
 if(!data){result.innerHTML='<div class="info error">Kelime bilgisi alınamadı. İnternet bağlantını kontrol et veya farklı bir kelime dene.</div>';return}
 result.innerHTML=`<div class="resultgrid"><div class="mini"><b>Kelime</b>${esc(word)}</div><div class="mini"><b>Tanım</b>${esc(data.definition)}</div>
 <div class="mini"><b>Telaffuz</b>${esc(data.phonetic||'—')} &nbsp; <b style="display:inline">Tür</b> ${esc(data.type||'—')}</div>
 <label>Türkçe anlam *</label><input id="meaning" value="${esc(data.meaning||'')}" placeholder="Örn. önemli, kayda değer">
 <label>Örnek cümlen</label><textarea id="example">${esc(data.example||'')}</textarea><label>Notun</label><textarea id="note" placeholder="Kelimeyi hatırlatacak kısa not..."></textarea>
 ${data.synonyms?`<div class="mini"><b>Synonym</b>${esc(data.synonyms)}</div>`:''}${data.antonyms?`<div class="mini"><b>Antonym</b>${esc(data.antonyms)}</div>`:''}
 <button class="btn primary" onclick='saveWord(${JSON.stringify({word,...data})})'>💾 Kelimeyi kaydet</button></div>`;
}
function saveWord(data){
 const meaning=document.getElementById('meaning').value.trim(),example=document.getElementById('example').value.trim(),note=document.getElementById('note').value.trim();
 if(!meaning){toast('Türkçe anlamı yazmalısın.');return}
 const old=words.find(w=>w.word===data.word);
 words=words.filter(w=>w.word!==data.word);
 words.push({...data,meaning,example,note,added:today(),interval:old?.interval||0,repetitions:old?.repetitions||0,nextReview:new Date().toISOString()});
 save();toast('✅ Kelime kaydedildi');setTimeout(()=>nav('home'),500);
}

function startLearning(){currentPage='review';showReview(0)}
function startReview(){currentPage='review';showReview(0)}
function showReview(i){
 const due=dueWords();
 if(!due.length){currentPage='home';render();toast('🎉 Bugünlük tekrarın tamam!');return}
 const w=due[i%due.length],m=document.getElementById('main');
 m.innerHTML=`<h1>Akıllı tekrar</h1><div class="sub">${(i%due.length)+1} / ${due.length} kelime</div>
 <div class="card"><span class="pill">Hatırlıyor musun?</span><div class="word">${esc(w.word)}</div>
 <div class="meta">${esc(w.phonetic||'')} • ${esc(w.type||'')}</div>
 <div id="answerBox" class="hidden"><div class="meaning">${esc(w.meaning)}</div><div class="example">${esc(w.example||w.definition||'')}</div>${w.note?`<div class="mini" style="margin-top:12px"><b>Notum</b>${esc(w.note)}</div>`:''}</div>
 <button id="showBtn" class="btn primary" style="width:100%;margin-top:22px" onclick="revealAnswer()">Anlamı göster</button>
 <div id="actions" class="hidden"><div class="meta" style="margin-top:18px">Nasıl hatırladın?</div>
 <div class="review-actions"><button class="again" onclick="rateWord('${encodeURIComponent(w.word)}','again')">😵 Unuttum</button><button class="hard" onclick="rateWord('${encodeURIComponent(w.word)}','hard')">🤔 Zorlandım</button><button class="good" onclick="rateWord('${encodeURIComponent(w.word)}','good')">😊 Hatırladım</button></div></div></div>`;
}
function revealAnswer(){document.getElementById('answerBox').classList.remove('hidden');document.getElementById('showBtn').classList.add('hidden');document.getElementById('actions').classList.remove('hidden')}
function rateWord(encoded,quality){
 const word=decodeURIComponent(encoded),w=words.find(x=>x.word===word);if(!w)return;
 const intervals={again:10*60*1000,hard:24*60*60*1000,good:0};
 if(quality==='good'){w.repetitions=(w.repetitions||0)+1;const levels=[1,3,7,14,30];w.interval=levels[Math.min(w.repetitions-1,levels.length-1)];intervals.good=w.interval*24*60*60*1000}
 if(quality==='hard'){w.repetitions=Math.max(0,w.repetitions||0);w.interval=1}
 if(quality==='again'){w.repetitions=0;w.interval=0}
 w.nextReview=new Date(Date.now()+intervals[quality]).toISOString();save();showReview(0);
}
function intervalLabel(n){return n?`${n} gün`:'ilk tekrar'}

function quiz(m){
 if(!words.length){m.innerHTML=`<h1>Quiz</h1><div class="sub">Henüz kendi kelimelerin yok.</div><div class="card empty">Önce birkaç kelime ekleyelim. 🚀</div><button class="btn primary" style="width:100%" onclick="nav('add')">＋ İlk kelimeyi ekle</button>`;return}
 const w=words[quizIndex%words.length];
 m.innerHTML=`<h1>Quiz</h1><div class="sub">${quizIndex+1}. soru</div><div class="card"><div class="pill">İngilizce → Türkçe</div><div class="quizq" style="margin-top:20px">${esc(w.word)}</div>
 <input id="answer" style="margin-top:20px" placeholder="Türkçe anlamını yaz..." onkeydown="if(event.key==='Enter')checkAnswer()"><button class="btn primary" style="width:100%;margin-top:12px" onclick="checkAnswer()">Cevabı kontrol et</button><div id="quizResult"></div></div>`;
}
function checkAnswer(){const w=words[quizIndex%words.length],a=document.getElementById('answer').value.trim().toLowerCase(),target=(w.meaning||'').toLowerCase(),ok=a&&target.split(/[,;]/).some(x=>a.includes(x.trim())||x.trim().includes(a));document.getElementById('quizResult').innerHTML=`<div class="info ${ok?'success':'error'}">${ok?'✅ Doğru!':'❌ Tekrar et.'}<br><b>Doğru anlam:</b> ${esc(w.meaning)}</div><button class="btn secondary" style="width:100%;margin-top:10px" onclick="quizIndex++;quiz(document.getElementById('main'))">Sonraki soru →</button>`}

function stats(m){
 const due=dueWords();
 m.innerHTML=`<h1>İlerleme</h1><div class="sub">Kelime hazineni takip et.</div><div class="stats"><div class="stat"><strong>${words.length}</strong>Toplam kelime</div><div class="stat"><strong>${due.length}</strong>Tekrar bekleyen</div></div>
 <div class="card" style="margin-top:18px"><h2>Kelime listem</h2>${words.length?words.slice().reverse().map(w=>`<div class="listitem"><div><b>${esc(w.word)}</b><div class="meta">${esc(w.meaning||'')}</div><div class="progressline"><span>Tekrar</span><span>${w.nextReview&&new Date(w.nextReview)>new Date()?'📅 '+new Date(w.nextReview).toLocaleDateString('tr-TR'):'🔔 Şimdi'}</span></div></div><button class="delete" onclick="deleteWord('${encodeURIComponent(w.word)}')">Sil</button></div>`).join(''):'<div class="empty">Henüz kelime eklemedin.</div>'}</div>`;
}
function deleteWord(encoded){const word=decodeURIComponent(encoded);words=words.filter(w=>w.word!==word);save();toast('Kelime silindi');render()}
render();
</script>
</body>
</html>
